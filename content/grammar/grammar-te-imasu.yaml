# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-te-imasu
  kind: grammar
  note:
    'Verb て-form + います often describes an ongoing action: 読んでいます. It can also describe a resulting state
    with some verbs, so it is not always an exact equivalent of English “-ing”.'
  tags:
    - Grammar
    - te-imasu
  level: N5
  title: 'Ongoing actions: ています'
  topic: Sentence building
  lesson:
    goal: Describe an action happening now.
    group: Requests and ongoing actions
    order: 25
    recap:
      Use verb て-form + います for an ongoing action. 読んでいます means “am reading”; 読みます often describes a routine.
      Some verbs use this form for a resulting state.
    examples:
      - tokens:
          - { role: modifier, text: 今, reading: いま, wordClass: modifier }
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読んでいます, reading: よんでいます, wordClass: predicate }
        meaning: I am reading a book now.
        reading: いまほんをよんでいます。
        japanese: 今本を読んでいます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'am reading ' }
          - { role: object, text: a book }
          - { role: modifier, text: ' now.' }
      - tokens:
          - { role: modifier, text: 今, reading: いま, wordClass: modifier }
          - { role: object, text: 水, reading: みず, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 飲んでいます, reading: のんでいます, wordClass: predicate }
        meaning: I am drinking water now.
        reading: いまみずをのんでいます。
        japanese: 今水を飲んでいます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'am drinking ' }
          - { role: object, text: water }
          - { role: modifier, text: ' now.' }
      - tokens:
          - { role: modifier, text: 今, reading: いま, wordClass: modifier }
          - { role: object, text: 名前, reading: なまえ, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 書いています, reading: かいています, wordClass: predicate }
        meaning: I am writing my name now.
        reading: いまなまえをかいています。
        japanese: 今名前を書いています。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'am writing ' }
          - { role: object, text: my name }
          - { role: modifier, text: ' now.' }
    comparison:
      Use verb て-form + います for an ongoing action. 読んでいます means “am reading”; 読みます often describes a
      routine. Some verbs use this form for a resulting state.
    vocabulary:
      - text: 今
        meaning: now
        reading: いま
      - text: 本
        meaning: book
        reading: ほん
      - text: 読んでいます
        meaning: am reading
        reading: よんでいます
      - text: 水
        meaning: water
        reading: みず
      - text: 飲んでいます
        meaning: am drinking
        reading: のんでいます
      - text: 名前
        meaning: name
        reading: なまえ
      - text: 書いています
        meaning: am writing
        reading: かいています
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べています
        meaning: am eating
        reading: たべています
    prerequisites:
      - grammar-te-request
      - grammar-imasu
  meaning: I am reading a book now.
  reading: いまほんをよんでいます。
  examples:
    - tokens:
        - { role: modifier, text: 今, reading: いま, wordClass: time noun }
        - { role: object, text: 本, reading: ほん, wordClass: noun }
        - { role: particle, text: を, reading: を, wordClass: object particle }
        - {
            role: predicate,
            text: 読んでいます,
            reading: よんでいます,
            wordClass: verb + auxiliary,
          }
      meaning: I am reading a book now.
      reading: いまほんをよんでいます。
      japanese: 今本を読んでいます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: am reading, implicit: false }
        - { role: object, text: ' a book', implicit: false }
        - { role: modifier, text: ' now.', implicit: false }
  exercise:
    tiles:
      - 今
      - 本
      - を
      - 読んで
      - います
    prompt: 'Build: “I am reading a book now.” Start with 今.'
    answers:
      - 今本を読んでいます
      - いまほんをよんでいます
    explanation:
      'Verb て-form + います often describes an ongoing action: 読んでいます. It can also describe a resulting
      state with some verbs, so it is not always an exact equivalent of English “-ing”.'
  japanese: 今本を読んでいます。
