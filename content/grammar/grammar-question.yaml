# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-question
  kind: grammar
  note:
    Add か to a polite statement to ask a question. A question mark is optional. Answer with はい / いいえ and the
    relevant predicate. 何ですか asks what something is.
  tags:
    - Grammar
    - question
  level: N5
  title: Questions with か
  topic: Sentence building
  lesson:
    goal: Ask a polite yes-or-no question.
    group: Sentence basics
    order: 2
    recap: A statement ends in です; add か to make a question.
    examples:
      - tokens:
          - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
          - { role: particle, text: か, reading: か, wordClass: particle }
        meaning: Is this a book?
        reading: これはほんですか。
        japanese: これは本ですか。
        translationTokens:
          - { role: predicate, text: 'Is ' }
          - { role: topic, text: this }
          - { role: predicate, text: ' a book' }
          - { role: particle, text: '?' }
      - tokens:
          - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 先生です, reading: せんせいです, wordClass: predicate }
          - { role: particle, text: か, reading: か, wordClass: particle }
        meaning: Is Tanaka a teacher?
        reading: たなかさんはせんせいですか。
        japanese: 田中さんは先生ですか。
        translationTokens:
          - { role: predicate, text: 'Is ' }
          - { role: topic, text: Tanaka }
          - { role: predicate, text: ' a teacher' }
          - { role: particle, text: '?' }
      - tokens:
          - { role: topic, text: それ, reading: それ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 時計です, reading: とけいです, wordClass: predicate }
          - { role: particle, text: か, reading: か, wordClass: particle }
        meaning: Is that a clock?
        reading: それはとけいですか。
        japanese: それは時計ですか。
        translationTokens:
          - { role: predicate, text: 'Is ' }
          - { role: topic, text: that }
          - { role: predicate, text: ' a clock' }
          - { role: particle, text: '?' }
    comparison: A statement ends in です; add か to make a question.
    vocabulary:
      - text: 本
        meaning: book
        reading: ほん
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 時計
        meaning: clock / watch
        reading: とけい
      - text: 学校
        meaning: school
        reading: がっこう
    prerequisites:
      - grammar-desu
  meaning: Is this a book?
  reading: これはほんですか。
  examples:
    - tokens:
        - { role: topic, text: これ, reading: これ, wordClass: demonstrative pronoun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 本です, reading: ほんです, wordClass: noun + copula }
        - { role: particle, text: か, reading: か, wordClass: question particle }
      meaning: Is this a book?
      reading: これはほんですか。
      japanese: これは本ですか。
      translationTokens:
        - { role: predicate, text: 'Is ', implicit: false }
        - { role: topic, text: this, implicit: false }
        - { role: predicate, text: ' a book', implicit: false }
        - { role: particle, text: '?', implicit: false }
  exercise:
    tiles:
      - これ
      - は
      - 本
      - です
      - か
    prompt: 'Build: “Is this a book?”'
    answers:
      - これは本ですか
      - これはほんですか
    explanation:
      Add か to a polite statement to ask a question. A question mark is optional. Answer with はい / いいえ
      and the relevant predicate. 何ですか asks what something is.
  japanese: これは本ですか。
