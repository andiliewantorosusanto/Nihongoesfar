entry:
  id: study-particle-o
  kind: grammar
  note:
    を is written wo but normally pronounced o. It marks the direct object of an action such as eating,
    drinking, or reading. It can also mark a route or place traversed, as in 公園を歩きます (walk through the park).
  tags:
    - Study guide
  level: N5
  title: を — the o particle
  topic: Grammar basics
  romaji: o / wo
  meaning: を — the o particle
  reading: みずをのみます。
  examples:
    - tokens:
        - { role: object, text: 水, reading: みず, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 飲みます, reading: のみます, wordClass: predicate }
      meaning: I drink water.
      reading: みずをのみます。
      japanese: 水を飲みます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'drink ' }
        - { role: object, text: water. }
    - tokens:
        - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 読みます, reading: よみます, wordClass: predicate }
      meaning: I read a book.
      reading: ほんをよみます。
      japanese: 本を読みます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'read ' }
        - { role: object, text: a book. }
    - tokens:
        - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 食べます, reading: たべます, wordClass: predicate }
      meaning: I eat bread.
      reading: ぱんをたべます。
      japanese: パンを食べます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'eat ' }
        - { role: object, text: bread. }
    - tokens:
        - { role: modifier, text: 公園, reading: こうえん, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 歩きます, reading: あるきます, wordClass: predicate }
      meaning: I walk through the park.
      reading: こうえんをあるきます。
      japanese: 公園を歩きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: walk }
        - { role: modifier, text: ' through the park.' }
  japanese: 水を飲みます。
  references:
    - rows:
        - - text: を
            reading: を
          - text: o
            reading: ''
      columns:
        - Written
        - Said as
      heading: Spelling and particle pronunciation
