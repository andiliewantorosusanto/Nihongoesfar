# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-te-request
  kind: grammar
  note:
    'Verb て-form + ください makes a request. 書く becomes 書いて. て-form changes depend on the verb group: 食べる→食べて,
    読む→読んで, する→して, 来る→来て; 行く is exceptional: 行って.'
  tags:
    - Grammar
    - te-request
  level: N5
  title: 'Requests: てください'
  topic: Sentence building
  lesson:
    goal: Make a polite request using a verb's て-form.
    group: Requests and ongoing actions
    order: 24
    recap: 'Use the て-form before ください: 読む→読んで, 飲む→飲んで, 書く→書いて, 食べる→食べて. Do not use the ます form here.'
    examples:
      - tokens:
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読んでください, reading: よんでください, wordClass: predicate }
        meaning: Please read the book.
        reading: ほんをよんでください。
        japanese: 本を読んでください。
        translationTokens:
          - { role: predicate, text: 'Please read ' }
          - { role: object, text: the book. }
      - tokens:
          - { role: object, text: 水, reading: みず, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 飲んでください, reading: のんでください, wordClass: predicate }
        meaning: Please drink the water.
        reading: みずをのんでください。
        japanese: 水を飲んでください。
        translationTokens:
          - { role: predicate, text: 'Please drink ' }
          - { role: object, text: the water. }
      - tokens:
          - { role: object, text: 名前, reading: なまえ, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 書いてください, reading: かいてください, wordClass: predicate }
        meaning: Please write your name.
        reading: なまえをかいてください。
        japanese: 名前を書いてください。
        translationTokens:
          - { role: predicate, text: 'Please write ' }
          - { role: object, text: your name. }
    comparison: 'Use the て-form before ください: 読む→読んで, 飲む→飲んで, 書く→書いて, 食べる→食べて. Do not use the ます form here.'
    vocabulary:
      - text: 本
        meaning: book
        reading: ほん
      - text: 読んで
        meaning: read (て-form)
        reading: よんで
      - text: 水
        meaning: water
        reading: みず
      - text: 飲んで
        meaning: drink (て-form)
        reading: のんで
      - text: 名前
        meaning: name
        reading: なまえ
      - text: 書いて
        meaning: write (て-form)
        reading: かいて
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べて
        meaning: eat (て-form)
        reading: たべて
    prerequisites:
      - grammar-masu
      - grammar-object
  meaning: Please write your name.
  reading: なまえをかいてください。
  examples:
    - tokens:
        - { role: object, text: 名前, reading: なまえ, wordClass: noun }
        - { role: particle, text: を, reading: を, wordClass: object particle }
        - {
            role: predicate,
            text: 書いてください,
            reading: かいてください,
            wordClass: verb + request expression,
          }
      meaning: Please write your name.
      reading: なまえをかいてください。
      japanese: 名前を書いてください。
      translationTokens:
        - { role: predicate, text: Please write, implicit: false }
        - { role: object, text: ' your name.', implicit: false }
  exercise:
    tiles:
      - 名前
      - を
      - 書いて
      - ください
    prompt: 'Build: “Please write your name.”'
    answers:
      - 名前を書いてください
      - なまえをかいてください
    explanation:
      'Verb て-form + ください makes a request. 書く becomes 書いて. て-form changes depend on the verb group:
      食べる→食べて, 読む→読んで, する→して, 来る→来て; 行く is exceptional: 行って.'
  japanese: 名前を書いてください。
