# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-na-adjective
  kind: grammar
  note:
    'A な-adjective uses な directly before a noun: 静かな部屋. At the end of a polite sentence, use 静かです, not
    静かなです. Negative: 静かじゃありません; past: 静かでした. きれい and 嫌い belong to this group.'
  tags:
    - Grammar
    - na-adjective
  level: N5
  title: な-adjectives in sentences
  topic: Sentence building
  lesson:
    goal: Describe a place with a な-adjective.
    group: Descriptions and preferences
    order: 20
    recap: 'Use な before a noun, but omit it before です: 静かな部屋 / 部屋は静かです. きれい is a な-adjective despite ending in い.'
    examples:
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 部屋, reading: へや, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 静かです, reading: しずかです, wordClass: predicate }
        meaning: This room is quiet.
        reading: このへやはしずかです。
        japanese: この部屋は静かです。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: room }
          - { role: predicate, text: ' is quiet.' }
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 学校, reading: がっこう, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 便利です, reading: べんりです, wordClass: predicate }
        meaning: This school is convenient.
        reading: このがっこうはべんりです。
        japanese: この学校は便利です。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: school }
          - { role: predicate, text: ' is convenient.' }
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 部屋, reading: へや, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: きれいです, reading: きれいです, wordClass: predicate }
        meaning: This room is clean.
        reading: このへやはきれいです。
        japanese: この部屋はきれいです。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: room }
          - { role: predicate, text: ' is clean.' }
    comparison: 'Use な before a noun, but omit it before です: 静かな部屋 / 部屋は静かです. きれい is a な-adjective despite ending in い.'
    vocabulary:
      - text: 部屋
        meaning: room
        reading: へや
      - text: 静か
        meaning: quiet
        reading: しずか
      - text: 学校
        meaning: school
        reading: がっこう
      - text: 便利
        meaning: convenient
        reading: べんり
      - text: きれい
        meaning: clean / beautiful
        reading: きれい
      - text: 町
        meaning: town
        reading: まち
    prerequisites:
      - grammar-desu
      - grammar-i-adjective
  meaning: It is quiet here.
  reading: ここはしずかです。
  examples:
    - tokens:
        - { role: topic, text: ここ, reading: ここ, wordClass: place pronoun }
        - { role: particle, text: は, reading: は, wordClass: topic particle }
        - { role: predicate, text: 静かです, reading: しずかです, wordClass: na-adjective + copula }
      meaning: It is quiet here.
      reading: ここはしずかです。
      japanese: ここは静かです。
      translationTokens:
        - { role: implicit, text: 'It ', implicit: true }
        - { role: predicate, text: is quiet, implicit: false }
        - { role: topic, text: ' here.', implicit: false }
  exercise:
    prompt: 'Fill the missing word: 静か __ 部屋 (a quiet room).'
    answers:
      - な
    explanation:
      'A な-adjective uses な directly before a noun: 静かな部屋. At the end of a polite sentence, use 静かです,
      not 静かなです. Negative: 静かじゃありません; past: 静かでした. きれい and 嫌い belong to this group.'
  japanese: ここは静かです。
