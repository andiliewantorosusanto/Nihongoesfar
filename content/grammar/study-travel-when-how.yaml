# Grammar source. Run npm run content:build after editing.
entry:
  id: study-travel-when-how
  kind: grammar
  note:
    'Combine the patterns: transport + で + destination + に / へ + movement verb. Use 行きます (いきます) for go, 来ます
    (きます) for come toward the speaker or viewpoint, and 帰ります (かえります) for return home. Past polite forms are
    行きました (いきました), 来ました (きました), and 帰りました (かえりました). A specific clock time takes に; 昨日 (きのう, yesterday) does
    not. Say 歩いて (あるいて) for “on foot”, not 歩いてで. Ask 何で行きますか (なんでいきますか) about transport; どうやって行きますか is another
    way to ask how to get there.'
  tags:
    - Study guide
  level: N5
  title: 'Travel: where, when, and how'
  topic: Polite verbs and particles
  meaning: 'Travel: where, when, and how'
  reading: でぱーとへいきます。
  examples:
    - tokens:
        - { role: modifier, text: デパート, reading: でぱーと, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 行きます, reading: いきます, wordClass: predicate }
      meaning: I go to the department store.
      reading: でぱーとへいきます。
      japanese: デパートへ行きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: go }
        - { role: modifier, text: ' to the department store.' }
    - tokens:
        - { role: modifier, text: 昨日, reading: きのう, wordClass: noun phrase }
        - { role: modifier, text: 日本, reading: にほん, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 来ました, reading: きました, wordClass: predicate }
      meaning: I came to Japan yesterday.
      reading: きのうにほんにきました。
      japanese: 昨日日本に来ました。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: came }
        - { role: modifier, text: ' to Japan' }
        - { role: modifier, text: ' yesterday.' }
    - tokens:
        - { role: modifier, text: 昨日, reading: きのう, wordClass: noun phrase }
        - { role: modifier, text: 十一時, reading: じゅういちじ, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: modifier, text: 家, reading: いえ, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 帰りました, reading: かえりました, wordClass: predicate }
      meaning: I returned home at eleven yesterday.
      reading: きのうじゅういちじにいえへかえりました。
      japanese: 昨日十一時に家へ帰りました。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: returned }
        - { role: modifier, text: ' home' }
        - { role: modifier, text: ' at eleven' }
        - { role: modifier, text: ' yesterday.' }
    - tokens:
        - { role: modifier, text: 飛行機, reading: ひこうき, wordClass: noun phrase }
        - { role: particle, text: で, reading: で, wordClass: particle }
        - { role: modifier, text: 日本, reading: にほん, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 行きます, reading: いきます, wordClass: predicate }
      meaning: I go to Japan by plane.
