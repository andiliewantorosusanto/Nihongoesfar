# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-hoshii
  kind: grammar
  note:
    ほしい is an い-adjective, not a verb. A common beginner pattern is 私は noun がほしいです. Its negative is ほしくないです.
    Use verb stem + たい for wanting to do an action. Direct statements normally describe the speaker’s own
    desire.
  tags:
    - Grammar
    - hoshii
  level: N5
  title: 'Want a thing: ほしい'
  topic: Sentence building
  lesson:
    goal: Say what thing you want.
    group: Descriptions and preferences
    order: 22
    recap: Use が + ほしい for a wanted thing. Use verb stem + たい for an action you want to do.
    examples:
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: ほしいです, reading: ほしいです, wordClass: predicate }
        meaning: I want a book.
        reading: わたしはほんがほしいです。
        japanese: 私は本がほしいです。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' want ' }
          - { role: subject, text: a book. }
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: subject, text: 車, reading: くるま, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: ほしいです, reading: ほしいです, wordClass: predicate }
        meaning: I want a car.
        reading: わたしはくるまがほしいです。
        japanese: 私は車がほしいです。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' want ' }
          - { role: subject, text: a car. }
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: subject, text: 時計, reading: とけい, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: ほしいです, reading: ほしいです, wordClass: predicate }
        meaning: I want a clock.
        reading: わたしはとけいがほしいです。
        japanese: 私は時計がほしいです。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' want ' }
          - { role: subject, text: a clock. }
    comparison: Use が + ほしい for a wanted thing. Use verb stem + たい for an action you want to do.
    vocabulary:
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 本
        meaning: book
        reading: ほん
      - text: ほしいです
        meaning: want a thing
        reading: ほしいです
      - text: 車
        meaning: car
        reading: くるま
      - text: 時計
        meaning: clock / watch
        reading: とけい
      - text: 水
        meaning: water
        reading: みず
    prerequisites:
      - grammar-i-adjective
      - grammar-suki
  meaning: I want a book.
  reading: わたしはほんがほしいです。
  examples:
    - tokens:
        - { role: topic, text: 私, reading: わたし, wordClass: pronoun }
        - { role: particle, text: は, reading: は, wordClass: topic particle }
        - { role: subject, text: 本, reading: ほん, wordClass: noun }
        - { role: particle, text: が, reading: が, wordClass: subject particle }
        - {
            role: predicate,
            text: ほしいです,
            reading: ほしいです,
            wordClass: i-adjective + polite ending,
          }
      meaning: I want a book.
      reading: わたしはほんがほしいです。
      japanese: 私は本がほしいです。
      translationTokens:
        - { role: topic, text: I, implicit: false }
        - { role: predicate, text: ' want ', implicit: false }
        - { role: subject, text: a book., implicit: false }
  exercise:
    tiles:
      - 私
      - は
      - 本
      - が
      - ほしい
      - です
    prompt: 'Build: “I want a book.” Start with 私は.'
    answers:
      - 私は本がほしいです
      - 私は本が欲しいです
      - わたしはほんがほしいです
    explanation:
      ほしい is an い-adjective, not a verb. A common beginner pattern is 私は noun がほしいです. Its negative is
      ほしくないです. Use verb stem + たい for wanting to do an action. Direct statements normally describe the
      speaker’s own desire.
  japanese: 私は本がほしいです。
