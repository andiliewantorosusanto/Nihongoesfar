# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-i-adjective
  kind: grammar
  note:
    'Most い-adjectives keep final い before a noun: 面白い本. Negative: 面白くないです; past: 面白かったです; negative past:
    面白くなかったです. Add です for polite speech, but not な before the noun.'
  tags:
    - Grammar
    - i-adjective
  level: N5
  title: い-adjectives in sentences
  topic: Sentence building
  lesson:
    goal: Describe something with an い-adjective.
    group: Descriptions and preferences
    order: 19
    recap: An い-adjective can go directly before a noun. Do not insert な after an い-adjective such as 高い.
    examples:
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 面白いです, reading: おもしろいです, wordClass: predicate }
        meaning: This book is interesting.
        reading: このほんはおもしろいです。
        japanese: この本は面白いです。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: book }
          - { role: predicate, text: ' is interesting.' }
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 車, reading: くるま, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 高いです, reading: たかいです, wordClass: predicate }
        meaning: This car is expensive.
        reading: このくるまはたかいです。
        japanese: この車は高いです。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: car }
          - { role: predicate, text: ' is expensive.' }
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 部屋, reading: へや, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 大きいです, reading: おおきいです, wordClass: predicate }
        meaning: This room is big.
        reading: このへやはおおきいです。
        japanese: この部屋は大きいです。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: room }
          - { role: predicate, text: ' is big.' }
    comparison: An い-adjective can go directly before a noun. Do not insert な after an い-adjective such as 高い.
    vocabulary:
      - text: 本
        meaning: book
        reading: ほん
      - text: 面白い
        meaning: interesting
        reading: おもしろい
      - text: 車
        meaning: car
        reading: くるま
      - text: 高い
        meaning: expensive / high
        reading: たかい
      - text: 部屋
        meaning: room
        reading: へや
      - text: 大きい
        meaning: big
        reading: おおきい
      - text: 新しい
        meaning: new
        reading: あたらしい
    prerequisites:
      - grammar-desu
  meaning: This book is interesting.
  reading: このほんはおもしろいです。
  examples:
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: determiner }
        - { role: topic, text: 本, reading: ほん, wordClass: noun }
        - { role: particle, text: は, reading: は, wordClass: topic particle }
        - {
            role: predicate,
            text: 面白いです,
            reading: おもしろいです,
            wordClass: i-adjective + polite ending,
          }
      meaning: This book is interesting.
      reading: このほんはおもしろいです。
      japanese: この本は面白いです。
      translationTokens:
        - { role: modifier, text: This, implicit: false }
        - { role: topic, text: ' book', implicit: false }
        - { role: predicate, text: ' is interesting.', implicit: false }
  exercise:
    prompt: Make 面白いです negative.
    answers:
      - 面白くないです
      - おもしろくないです
      - 面白くありません
      - おもしろくありません
    explanation:
      'Most い-adjectives keep final い before a noun: 面白い本. Negative: 面白くないです; past: 面白かったです; negative
      past: 面白くなかったです. Add です for polite speech, but not な before the noun.'
  japanese: この本は面白いです。
