exercises:
  - id: meaning
    type: meaning-choice
    sentence: there-is-a-cat
    choices:
      - text: There is a cat.
        reading: ''
      - text: There is a book.
        reading: ''
    answers:
      - There is a cat.
  - id: pattern
    type: pattern-choice
    sentence: there-is-a-cat
    choices:
      - sentence: there-is-a-cat
      - text: 猫があります。
        tiles:
          - { text: 猫, reading: ねこ }
          - { text: が, reading: が }
          - { text: あります, reading: あります }
        tokens:
          - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: あります, reading: あります, wordClass: predicate }
        meaning: There is a book.
        reading: ねこがあります。
    prompt: 'Choose the correct Japanese: There is a cat.'
    answers:
      - 猫がいます
      - ねこがいます
  - id: gap
    type: gap
    sentence: there-is-a-teacher
    answers:
      - います
      - います
    context:
      text: 先生が___。
      tokens:
        - { role: subject, text: 先生, reading: せんせい, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: ___, reading: ___, wordClass: predicate }
      reading: せんせいが___。
  - id: tiles
    type: tiles
    sentence: there-is-a-teacher
    prompt: 'Build this sentence: There is a teacher. (polite)'
    answers:
      - 先生がいます
      - せんせいがいます
    tiles:
      - { role: subject, text: 先生, reading: せんせい, wordClass: noun phrase }
      - { role: particle, text: が, reading: が, wordClass: particle }
      - { role: predicate, text: います, reading: います, wordClass: predicate }
  - id: typing
    type: typing
    sentence: there-is-a-dog
    answers:
      - 犬がいます
      - いぬがいます
  - id: alternate
    type: typing
    sentence: tanaka-is-here
    alternate: true
    prompt: 'One more example: Tanaka is here. (polite)'
    answers:
      - 田中さんがいます
      - たなかさんがいます
  - id: extra-1-tiles
