# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-imasu
  kind: grammar
  note:
    Use います for people and animals. Compare 本があります (there is a book) and 猫がいます (there is a cat). います is also
    used with verb て-forms, but that is a different construction.
  tags:
    - Grammar
    - imasu
  level: N5
  title: 'People and animals: います'
  topic: Sentence building
  lesson:
    goal: Say that a person or animal is present.
    group: Existence and location
    order: 12
    recap: Use います for people and animals; use あります for things.
    examples:
      - tokens:
          - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: います, reading: います, wordClass: predicate }
        meaning: There is a cat.
        reading: ねこがいます。
        japanese: 猫がいます。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a cat. }
      - tokens:
          - { role: subject, text: 先生, reading: せんせい, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: います, reading: います, wordClass: predicate }
        meaning: There is a teacher.
        reading: せんせいがいます。
        japanese: 先生がいます。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a teacher. }
      - tokens:
          - { role: subject, text: 犬, reading: いぬ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: います, reading: います, wordClass: predicate }
        meaning: There is a dog.
        reading: いぬがいます。
        japanese: 犬がいます。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a dog. }
    comparison: Use います for people and animals; use あります for things.
    vocabulary:
      - text: 猫
        meaning: cat
        reading: ねこ
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 犬
        meaning: dog
        reading: いぬ
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
    prerequisites:
      - grammar-arimasu
  meaning: There is a cat.
  reading: ねこがいます。
  examples:
    - tokens:
        - { role: subject, text: 猫, reading: ねこ, wordClass: noun }
        - { role: particle, text: が, reading: が, wordClass: subject particle }
        - { role: predicate, text: います, reading: います, wordClass: animate existence verb }
      meaning: There is a cat.
      reading: ねこがいます。
      japanese: 猫がいます。
      translationTokens:
        - { role: predicate, text: 'There is ', implicit: false }
        - { role: subject, text: a cat., implicit: false }
  exercise:
    tiles:
      - 猫
      - が
      - います
    prompt: 'Build: “There is a cat.”'
    answers:
      - 猫がいます
      - ねこがいます
    explanation:
      Use います for people and animals. Compare 本があります (there is a book) and 猫がいます (there is a cat). います
      is also used with verb て-forms, but that is a different construction.
  japanese: 猫がいます。
