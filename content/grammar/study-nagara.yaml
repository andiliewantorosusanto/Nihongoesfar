entry:
  id: study-nagara
  kind: grammar
  title: ながら — do one action while doing another
  japanese: 音楽を聞きながら勉強します。
  reading: おんがくをききながらべんきょうします。
  meaning: ながら — do one action while doing another
  level: N5
  topic: Movement and expressions
  tags:
    - Study guide
  note:
    'Use verb ます-stem + ながら + main action. Remove ます: 聞きます (ききます) → 聞きながら (ききながら); 食べます (たべます) → 食べながら
    (たべながら); します → しながら. Both actions normally have the same subject. The action after ながら is the main action
    and carries tense: 音楽を聞きながら勉強します (おんがくをききながらべんきょうします) means I study while listening to music. Do not
    attach ながら to the full ます form or the dictionary form. This pattern describes simultaneous actions, rather
    than one action followed by another (て-form).'
  examples:
    - japanese: 音楽を聞きながら勉強します。
      reading: おんがくをききながらべんきょうします。
      meaning: I study while listening to music.
      tokens:
        - {
            text: 音楽を聞きながら,
            reading: おんがくをききながら,
            role: modifier,
            wordClass: phrase,
          }
        - { text: 勉強します, reading: べんきょうします, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: study, role: predicate }
        - { text: ' while listening to music', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: 歌いながら料理します。
      reading: うたいながらりょうりします。
      meaning: I cook while singing.
      tokens:
        - { text: 歌いながら, reading: うたいながら, role: modifier, wordClass: phrase }
        - { text: 料理します, reading: りょうりします, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: cook, role: predicate }
        - { text: ' while singing', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: テレビを見ながら晩ご飯を食べます。
      reading: てれびをみながらばんごはんをたべます。
      meaning: I eat dinner while watching television.
      tokens:
        - { text: テレビを見ながら, reading: てれびをみながら, role: modifier, wordClass: phrase }
        - {
            text: 晩ご飯を食べます,
            reading: ばんごはんをたべます,
            role: predicate,
            wordClass: phrase,
          }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: eat dinner, role: predicate }
        - { text: ' while watching television', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: コーヒーを飲みながら本を読みました。
      reading: こーひーをのみながらほんをよみました。
      meaning: I read a book while drinking coffee.
      tokens:
        - {
            text: コーヒーを飲みながら,
            reading: こーひーをのみながら,
            role: modifier,
            wordClass: phrase,
          }
        - { text: 本を読みました, reading: ほんをよみました, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: read a book, role: predicate }
        - { text: ' while drinking coffee', role: modifier }
        - { text: ., role: implicit, implicit: true }
