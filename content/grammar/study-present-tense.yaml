        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学生です, reading: がくせいです, wordClass: predicate }
      meaning: I am a student.
      reading: わたしはがくせいです。
      japanese: 私は学生です。
      translationTokens:
        - { role: topic, text: I }
        - { role: predicate, text: ' am a student.' }
    - tokens:
        - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 食べない, reading: たべない, wordClass: predicate }
      meaning: I do not eat bread.
      reading: ぱんをたべない。
      japanese: パンを食べない。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'do not eat ' }
        - { role: object, text: bread. }
    - tokens:
        - { role: topic, text: 今日, reading: きょう, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 暑くないです, reading: あつくないです, wordClass: predicate }
