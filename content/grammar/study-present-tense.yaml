sentences:
  i-am-a-student:
    text: 私は学生です。
    reading: わたしはがくせいです。
    meaning: I am a student.
    tokens:
      - { text: 私, reading: わたし, role: topic, wordClass: noun phrase }
      - { text: は, reading: は, role: particle, wordClass: particle }
      - { text: 学生です, reading: がくせいです, role: predicate, wordClass: predicate }
    translationTokens:
      - { text: I, role: topic }
      - { text: ' am a student.', role: predicate }
    hint: Identify the noun after は, then check whether the ending is present or past.
    explanation:
      私 (わたし) means “I”; は marks the topic. 学生 (がくせい) means “student”, while 先生 (せんせい) means “teacher”
      and 会社員 (かいしゃいん) means “employee”. です identifies the speaker as a student; “was a student” would use
      でした.
  i-do-not-eat-bread:
    text: パンを食べない。
    reading: ぱんをたべない。
    meaning: I do not eat bread.
    tokens:
      - { text: パン, reading: ぱん, role: object, wordClass: noun phrase }
      - { text: を, reading: を, role: particle, wordClass: particle }
      - { text: 食べない, reading: たべない, role: predicate, wordClass: predicate }
    translationTokens:
      - { text: 'I ', role: implicit, implicit: true }
      - { text: 'do not eat ', role: predicate }
      - { text: bread., role: object }
    hint: Check the food word and whether the verb is affirmative, negative, or past.
    explanation:
      パン means “bread”; ご飯 (ごはん) means “rice”. を marks what is eaten. 食べない (たべない) means “do not eat”;
      食べる (たべる) means “eat”, and 食べなかった (たべなかった) means “did not eat”.
    form: casual
  today-is-not-hot:
    text: 今日は暑くないです。
    reading: きょうはあつくないです。
    meaning: Today is not hot.
    tokens:
      - { text: 今日, reading: きょう, role: topic, wordClass: noun phrase }
      - { text: は, reading: は, role: particle, wordClass: particle }
      - { text: 暑くないです, reading: あつくないです, role: predicate, wordClass: predicate }
    translationTokens:
      - { text: Today, role: topic }
      - { text: ' is not hot.', role: predicate }
    form: polite
    hint: Check the time word, the negative ending, and whether this is a question.
    explanation:
      '今日 (きょう) means “today”. 暑い (あつい), “hot”, changes to 暑くない (あつくない), “not hot”. Add です for
      politeness: “Today is not hot.”'
  is-tanaka-well:
    text: 田中さんは元気ですか。
    reading: たなかさんはげんきですか。
    meaning: Is Tanaka well?
    tokens:
      - { text: 田中さん, reading: たなかさん, role: topic, wordClass: noun phrase }
      - { text: は, reading: は, role: particle, wordClass: particle }
      - { text: 元気です, reading: げんきです, role: predicate, wordClass: predicate }
      - { text: か, reading: か, role: particle, wordClass: particle }
    translationTokens:
      - { text: 'Is ', role: predicate }
      - { text: Tanaka, role: topic }
      - { text: ' well', role: predicate }
      - { text: '?', role: particle }
    form: polite
    hint: Check the time word, the negative ending, and whether this is a question.
    explanation: 元気 (げんき) means “well”. です makes a polite statement, and final か turns it into “Is Tanaka well?”
  i-do-not-eat-fish:
    tokens:
      - { role: object, text: 魚, reading: さかな, wordClass: noun phrase }
      - { role: particle, text: を, reading: を, wordClass: particle }
      - { role: predicate, text: 食べない, reading: たべない, wordClass: predicate }
    meaning: I do not eat fish.
    reading: さかなをたべない。
    translationTokens:
      - { role: implicit, text: 'I ', implicit: true }
      - { role: predicate, text: 'do not eat ' }
      - { role: object, text: fish. }
    text: 魚を食べない。
    hint: Check the particles and sentence ending.
    explanation: 魚を食べない。 means “I do not eat fish.” Match the vocabulary, particles, and tense to the English sentence.
    form: casual
  tomorrow-is-not-hot:
    tokens:
      - { role: topic, text: 明日, reading: あした, wordClass: noun phrase }
      - { role: particle, text: は, reading: は, wordClass: particle }
      - { role: predicate, text: 暑くないです, reading: あつくないです, wordClass: predicate }
    meaning: Tomorrow is not hot.
    reading: あしたはあつくないです。
    translationTokens:
      - { role: topic, text: Tomorrow }
      - { role: predicate, text: ' is not hot.' }
    text: 明日は暑くないです。
    hint: Check the particles and sentence ending.
    explanation:
      明日は暑くないです。 means “Tomorrow is not hot.” Match the vocabulary, particles, and tense to the English
      sentence.
    form: polite
