entry:
  id: study-present-tense
  kind: grammar
  note:
    'Learn the present / non-past forms together: polite, casual, negative polite, negative casual, and
    questions. Non-past also covers routines and future actions. Nouns and な-adjectives use だ / です;
    い-adjectives do not take だ. Verbs have their own dictionary and negative forms. Add か to a polite
    statement to ask a question; casual questions usually use rising intonation, for example 食べる？ (たべる？).
    Negative questions depend on context: 食べませんか (たべませんか) can invite someone to eat. では and じゃ are alternative
    forms in noun / な-adjective negatives. いい changes to よくない in the negative.'
  tags:
    - Study guide
    - Adjective guide
  level: N5
  title: Present
  topic: Tenses
  meaning: Present
  reading: わたしはがくせいです。
  examples:
