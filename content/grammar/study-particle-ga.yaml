entry:
  id: study-particle-ga
  kind: grammar
  note:
    が (ga) marks the subject. In basic existence sentences, it identifies what is present. は sets a topic; が
    can introduce the subject as new information or answer “who/what?”. They are not freely interchangeable in
    every sentence.
  tags:
    - Study guide
  level: N5
  title: が — the ga particle
  topic: Grammar basics
  romaji: ga
  meaning: が — the ga particle
  reading: ねこがいます。
  examples:
    - tokens:
        - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: います, reading: います, wordClass: predicate }
      meaning: There is a cat.
      reading: ねこがいます。
      japanese: 猫がいます。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a cat. }
    - tokens:
        - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: あります, reading: あります, wordClass: predicate }
      meaning: There is a book.
      reading: ほんがあります。
      japanese: 本があります。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a book. }
    - tokens:
        - { role: subject, text: 先生, reading: せんせい, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: います, reading: います, wordClass: predicate }
      meaning: There is a teacher.
      reading: せんせいがいます。
      japanese: 先生がいます。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a teacher. }
    - tokens:
        - { role: subject, text: 犬, reading: いぬ, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: います, reading: います, wordClass: predicate }
      meaning: There is a dog.
      reading: いぬがいます。
      japanese: 犬がいます。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a dog. }
  japanese: 猫がいます。
  references:
    - rows:
        - - text: が
            reading: が
          - text: ga
            reading: ''
      columns:
        - Written
        - Said as
      heading: Spelling and particle pronunciation
