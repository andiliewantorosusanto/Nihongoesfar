# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-mo
  kind: grammar
  note:
    も means “also / too” and often replaces は, が or を in the same position. 私も学生です adds me to a group of
    students already mentioned.
  tags:
    - Grammar
    - mo
  level: N5
  title: 'Also: も'
  topic: Sentence building
  lesson:
    goal: Add someone or something to an existing statement.
    group: Sentence basics
    order: 4
    recap: も often replaces は when adding “also”; do not stack は and も here.
    examples:
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: も, reading: も, wordClass: particle }
          - { role: predicate, text: 学生です, reading: がくせいです, wordClass: predicate }
        meaning: I am also a student.
        reading: わたしもがくせいです。
        japanese: 私も学生です。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' am ' }
          - { role: particle, text: also }
          - { role: predicate, text: ' a student.' }
      - tokens:
          - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
          - { role: particle, text: も, reading: も, wordClass: particle }
          - { role: predicate, text: 先生です, reading: せんせいです, wordClass: predicate }
        meaning: Tanaka is also a teacher.
        reading: たなかさんもせんせいです。
        japanese: 田中さんも先生です。
        translationTokens:
          - { role: topic, text: Tanaka }
          - { role: predicate, text: ' is ' }
          - { role: particle, text: also }
          - { role: predicate, text: ' a teacher.' }
      - tokens:
          - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
          - { role: particle, text: も, reading: も, wordClass: particle }
          - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
        meaning: This is also a book.
        reading: これもほんです。
        japanese: これも本です。
        translationTokens:
          - { role: topic, text: This }
          - { role: predicate, text: ' is ' }
          - { role: particle, text: also }
          - { role: predicate, text: ' a book.' }
    comparison: も often replaces は when adding “also”; do not stack は and も here.
    vocabulary:
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 学生
        meaning: student
        reading: がくせい
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 本
        meaning: book
        reading: ほん
      - text: 時計
        meaning: clock / watch
        reading: とけい
    prerequisites:
      - grammar-desu
  meaning: I am also a student.
  reading: わたしもがくせいです。
  examples:
    - tokens:
        - { role: topic, text: 私, reading: わたし, wordClass: pronoun }
        - { role: particle, text: も, reading: も, wordClass: additive particle }
        - { role: predicate, text: 学生です, reading: がくせいです, wordClass: noun + copula }
      meaning: I am also a student.
      reading: わたしもがくせいです。
      japanese: 私も学生です。
      translationTokens:
        - { role: topic, text: I, implicit: false }
        - { role: predicate, text: ' am ', implicit: false }
        - { role: particle, text: also, implicit: false }
        - { role: predicate, text: ' a student.', implicit: false }
  exercise:
    tiles:
      - 私
      - も
      - 学生
      - です
    prompt: 'Build: “I am also a student.”'
    answers:
      - 私も学生です
      - わたしもがくせいです
    explanation:
      も means “also / too” and often replaces は, が or を in the same position. 私も学生です adds me to a group
      of students already mentioned.
  japanese: 私も学生です。
