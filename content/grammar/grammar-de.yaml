# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-de
  kind: grammar
  note:
    'で marks the place where an action occurs. It also marks means: バスで行きます (go by bus). Use に for a
    destination or the location of existence, not で.'
  tags:
    - Grammar
    - de
  level: N5
  title: 'Action place and means: で'
  topic: Sentence building
  lesson:
    goal: Say where an action happens.
    group: Polite verbs and particles
    order: 8
    recap: Use で for where an action happens; use に for a destination or where something exists.
    examples:
      - tokens:
          - { role: modifier, text: 図書館, reading: としょかん, wordClass: modifier }
          - { role: particle, text: で, reading: で, wordClass: particle }
          - { role: predicate, text: 勉強します, reading: べんきょうします, wordClass: predicate }
        meaning: I study at the library.
        reading: としょかんでべんきょうします。
        japanese: 図書館で勉強します。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: study }
          - { role: modifier, text: ' at the library.' }
      - tokens:
          - { role: modifier, text: 家, reading: いえ, wordClass: modifier }
          - { role: particle, text: で, reading: で, wordClass: particle }
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読みます, reading: よみます, wordClass: predicate }
        meaning: I read a book at home.
        reading: いえでほんをよみます。
        japanese: 家で本を読みます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'read ' }
          - { role: object, text: a book }
          - { role: modifier, text: ' at home.' }
      - tokens:
          - { role: modifier, text: 学校, reading: がっこう, wordClass: modifier }
          - { role: particle, text: で, reading: で, wordClass: particle }
          - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 食べます, reading: たべます, wordClass: predicate }
        meaning: I eat bread at school.
        reading: がっこうでぱんをたべます。
        japanese: 学校でパンを食べます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'eat ' }
          - { role: object, text: bread }
          - { role: modifier, text: ' at school.' }
    comparison: Use で for where an action happens; use に for a destination or where something exists.
    vocabulary:
      - text: 図書館
        meaning: library
        reading: としょかん
      - text: 勉強します
        meaning: study
        reading: べんきょうします
      - text: 家
        meaning: home / house
        reading: いえ
      - text: 本
        meaning: book
        reading: ほん
      - text: 読みます
        meaning: read
        reading: よみます
      - text: 学校
        meaning: school
        reading: がっこう
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べます
        meaning: eat
        reading: たべます
      - text: お茶
        meaning: tea
        reading: おちゃ
      - text: 飲みます
        meaning: drink
        reading: のみます
    prerequisites:
      - grammar-masu
      - grammar-object
  meaning: I study at the library.
  reading: としょかんでべんきょうします。
  examples:
    - tokens:
        - {
            role: modifier,
            text: 図書館で,
            reading: としょかんで,
            wordClass: place noun + particle,
          }
        - { role: predicate, text: 勉強します, reading: べんきょうします, wordClass: verb }
      meaning: I study at the library.
      reading: としょかんでべんきょうします。
      japanese: 図書館で勉強します。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: study, implicit: false }
        - { role: modifier, text: ' at the library.', implicit: false }
  exercise:
    tiles:
      - 図書館
      - で
      - 勉強します
    prompt: 'Build: “I study at the library.”'
    answers:
      - 図書館で勉強します
      - としょかんでべんきょうします
    explanation:
      'で marks the place where an action occurs. It also marks means: バスで行きます (go by bus). Use に for a
      destination or the location of existence, not で.'
  japanese: 図書館で勉強します。
