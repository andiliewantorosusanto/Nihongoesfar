# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-noun-negative
  kind: grammar
  note:
    For noun predicates, replace です with じゃありません (polite) or ではありません (more formal). じゃないです is also common
    polite speech. Do not use plain ありません directly after a noun to mean “is not”.
  tags:
    - Grammar
    - noun-negative
  level: N5
  title: 'Noun negation: じゃありません'
  topic: Sentence building
  lesson:
    goal: Say that someone or something is not a noun.
    group: Negatives and past
    order: 14
    recap: Noun + じゃありません negates a noun sentence. Plain ありません alone expresses non-existence.
    examples:
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - {
              role: predicate,
              text: 先生じゃありません,
              reading: せんせいじゃありません,
              wordClass: predicate,
            }
        meaning: I am not a teacher.
        reading: わたしはせんせいじゃありません。
        japanese: 私は先生じゃありません。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' am not a teacher.' }
      - tokens:
          - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - {
              role: predicate,
              text: 本じゃありません,
              reading: ほんじゃありません,
              wordClass: predicate,
            }
        meaning: This is not a book.
        reading: これはほんじゃありません。
        japanese: これは本じゃありません。
        translationTokens:
          - { role: topic, text: This }
          - { role: predicate, text: ' is not a book.' }
      - tokens:
          - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - {
              role: predicate,
              text: 学生じゃありません,
              reading: がくせいじゃありません,
              wordClass: predicate,
            }
        meaning: Tanaka is not a student.
        reading: たなかさんはがくせいじゃありません。
        japanese: 田中さんは学生じゃありません。
        translationTokens:
          - { role: topic, text: Tanaka }
          - { role: predicate, text: ' is not a student.' }
    comparison: Noun + じゃありません negates a noun sentence. Plain ありません alone expresses non-existence.
    vocabulary:
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 本
        meaning: book
        reading: ほん
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: 学生
        meaning: student
        reading: がくせい
      - text: 時計
        meaning: clock / watch
        reading: とけい
    prerequisites:
      - grammar-desu
  meaning: I am not a teacher.
  reading: わたしはせんせいじゃありません。
  examples:
    - tokens:
        - { role: topic, text: 私, reading: わたし, wordClass: pronoun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - {
            role: predicate,
            text: 先生じゃありません,
            reading: せんせいじゃありません,
            wordClass: noun + negative copula,
          }
      meaning: I am not a teacher.
      reading: わたしはせんせいじゃありません。
      japanese: 私は先生じゃありません。
      translationTokens:
        - { role: topic, text: I, implicit: false }
        - { role: predicate, text: ' am not a teacher.', implicit: false }
  exercise:
    tiles:
      - 私
      - は
      - 先生
      - じゃありません
    prompt: 'Build: “I am not a teacher.” Start with 私.'
    answers:
      - 私は先生じゃありません
      - 私は先生ではありません
      - 私は先生じゃないです
      - わたしはせんせいじゃありません
      - わたしはせんせいではありません
      - わたしはせんせいじゃないです
    explanation:
      For noun predicates, replace です with じゃありません (polite) or ではありません (more formal). じゃないです is also
      common polite speech. Do not use plain ありません directly after a noun to mean “is not”.
  japanese: 私は先生じゃありません。
