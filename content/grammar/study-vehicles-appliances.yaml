entry:
  id: study-vehicles-appliances
  kind: grammar
  note:
    'Use vehicle + に + 乗ります (のります) to get on or into a vehicle, and vehicle + を + 降ります (おります) to get off or
    out. For example, 車に乗ります (くるまにのります) means get into a car, not 車に入ります. The place where you board or get off
    takes で: 駅で電車を降ります (えきででんしゃをおります). To switch an appliance or light on, use object + を + つけます; to switch it
    off, use object + を + 消します (けします). Compare 電気をつけます (でんきをつけます, I turn on the light) with 電気がつきます (でんきがつきます,
    the light comes on). 止めます (とめます) means stop a machine or operation; it does not always mean switch off the
    power.'
  tags:
    - Study guide
  level: N5
  title: 'Verb pairs: vehicles and appliances'
  topic: Polite verbs and particles
  meaning: 'Verb pairs: vehicles and appliances'
  reading: でんきをつけます。
  examples:
    - tokens:
        - { role: object, text: 電気, reading: でんき, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: つけます, reading: つけます, wordClass: predicate }
      meaning: I turn on the light.
      reading: でんきをつけます。
      japanese: 電気をつけます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'turn on ' }
        - { role: object, text: the light. }
    - tokens:
        - { role: object, text: テレビ, reading: てれび, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 消します, reading: けします, wordClass: predicate }
      meaning: I turn off the TV.
      reading: てれびをけします。
      japanese: テレビを消します。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'turn off ' }
        - { role: object, text: the TV. }
    - tokens:
        - { role: modifier, text: 車, reading: くるま, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 乗ります, reading: のります, wordClass: predicate }
      meaning: I get into the car.
      reading: くるまにのります。
      japanese: 車に乗ります。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: get into }
        - { role: modifier, text: ' the car.' }
    - tokens:
        - { role: modifier, text: バス, reading: ばす, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 降ります, reading: おります, wordClass: predicate }
      meaning: I get off the bus.
      reading: ばすをおります。
      japanese: バスを降ります。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: get off }
        - { role: modifier, text: ' the bus.' }
  japanese: 電気をつけます。
  references:
    - rows:
        - - text: Get into a car
            reading: ''
          - text: 車に乗ります
            reading: くるまにのります
          - text: 車に乗る
            reading: くるまにのる
        - - text: Get out of a car
            reading: ''
          - text: 車を降ります
            reading: くるまをおります
          - text: 車を降りる
            reading: くるまをおりる
        - - text: Get on a train
            reading: ''
          - text: 電車に乗ります
            reading: でんしゃにのります
          - text: 電車に乗る
            reading: でんしゃにのる
        - - text: Get off a train
            reading: ''
          - text: 電車を降ります
            reading: でんしゃをおります
          - text: 電車を降りる
            reading: でんしゃをおりる
      columns:
        - Situation
        - Polite
        - Casual
      heading: Get on / get off
    - rows:
        - - text: Turn on the light
            reading: ''
          - text: 電気をつけます
            reading: でんきをつけます
          - text: 電気をつける
            reading: でんきをつける
        - - text: Turn off the light
            reading: ''
          - text: 電気を消します
            reading: でんきをけします
          - text: 電気を消す
            reading: でんきをけす
        - - text: Turn on the TV
            reading: ''
          - text: テレビをつけます
            reading: てれびをつけます
          - text: テレビをつける
            reading: てれびをつける
        - - text: Turn off the TV
            reading: ''
          - text: テレビを消します
            reading: てれびをけします
          - text: テレビを消す
            reading: てれびをけす
        - - text: Turn on the air conditioner
            reading: ''
          - text: エアコンをつけます
            reading: えあこんをつけます
          - text: エアコンをつける
            reading: えあこんをつける
        - - text: Turn off the air conditioner
            reading: ''
          - text: エアコンを消します
            reading: えあこんをけします
          - text: エアコンを消す
            reading: えあこんをけす
      columns:
        - Situation
        - Polite
        - Casual
      heading: Switch on / switch off
