# Grammar source. Run npm run content:build after editing.
entry:
  id: study-masu-groups
  kind: grammar
  title: 'Verb groups: dictionary form → ます'
  japanese: 毎日、歯を磨きます。
  reading: まいにち、はをみがきます。
  meaning: Verb groups and polite ます forms
  level: N5
  topic: Daily routine
  tags:
    - Study guide
    - Verb forms
  note:
    'Group 1 (godan): change the final u-row sound to its i-row partner, then add ます: う→い, く→き, ぐ→ぎ, す→し,
    つ→ち, ぬ→に, ぶ→び, む→み, る→り. Group 2 (ichidan): remove final る and add ます. Many end in -iru or -eru, but the
    ending alone is not a reliable rule: 帰る (かえる), 入る (はいる), and 走る (はしる) are group 1. Group 3: する→します and 来る
    (くる)→来ます (きます). Compounds follow the same pattern: 勉強する→勉強します. ます is polite non-past; “talking” in
    progress is 話しています (はなしています). 死ぬ means die; 死んでいる (しんでいる) means be dead. 顔 (かお) is face; 皿 (さら) is plate.
    浴びる (あびる) means bathe or shower; する means do.'
  examples:
    - japanese: 毎日、歯を磨きます。
      reading: まいにち、はをみがきます。
      meaning: I brush my teeth every day.
      tokens:
        - {
            text: 毎日、歯を磨きます,
            reading: まいにち、はをみがきます,
            role: predicate,
            wordClass: sentence,
          }
      translationTokens:
        - { text: I brush my teeth every day., role: predicate }
    - japanese: 今、話しています。
      reading: いま、はなしています。
      meaning: I am talking now.
      tokens:
        - {
            text: 今、話しています,
            reading: いま、はなしています,
            role: predicate,
            wordClass: sentence,
          }
      translationTokens:
        - { text: I am talking now., role: predicate }
    - japanese: 学校から帰ります。
      reading: がっこうからかえります。
      meaning: I return home from school.
      tokens:
        - {
            text: 学校から帰ります,
            reading: がっこうからかえります,
            role: predicate,
            wordClass: sentence,
          }
      translationTokens:
        - { text: I return home from school., role: predicate }
    - japanese: 本を読みます。
      reading: ほんをよみます。
      meaning: I read a book.
      tokens:
        - { text: 本を読みます, reading: ほんをよみます, role: predicate, wordClass: sentence }
      translationTokens:
        - { text: I read a book., role: predicate }
  references:
    - heading: 'Group 1: final sound → i-row + ます'
      columns:
        - Dictionary
        - Polite
      rows:
        - - text: 言う
            reading: いう
          - text: 言います
            reading: いいます
        - - text: 話す
            reading: はなす
          - text: 話します
            reading: はなします
        - - text: 立つ
            reading: たつ
          - text: 立ちます
            reading: たちます
        - - text: 帰る
            reading: かえる
          - text: 帰ります
            reading: かえります
        - - text: 死ぬ
            reading: しぬ
          - text: 死にます
            reading: しにます
        - - text: 遊ぶ
            reading: あそぶ
          - text: 遊びます
            reading: あそびます
        - - text: 読む
            reading: よむ
          - text: 読みます
            reading: よみます
        - - text: 置く
            reading: おく
          - text: 置きます
            reading: おきます
        - - text: 泳ぐ
            reading: およぐ
          - text: 泳ぎます
            reading: およぎます
    - heading: Group 2 and irregular verbs
      columns:
        - Dictionary
        - Polite
      rows:
        - - text: あける
            reading: ''
          - text: あけます
            reading: ''
        - - text: しめる
            reading: ''
          - text: しめます
            reading: ''
        - - text: つける
            reading: ''
          - text: つけます
            reading: ''
        - - text: かける
            reading: ''
          - text: かけます
            reading: ''
        - - text: ねる
            reading: ''
          - text: ねます
            reading: ''
        - - text: つとめる
            reading: ''
          - text: つとめます
            reading: ''
        - - text: たべる
            reading: ''
          - text: たべます
            reading: ''
        - - text: おきる
            reading: ''
          - text: おきます
            reading: ''
        - - text: みる
            reading: ''
          - text: みます
            reading: ''
        - - text: あびる
            reading: ''
          - text: あびます
            reading: ''
        - - text: くる (irregular)
            reading: ''
          - text: きます
            reading: ''
        - - text: する (irregular)
            reading: ''
          - text: します
            reading: ''
