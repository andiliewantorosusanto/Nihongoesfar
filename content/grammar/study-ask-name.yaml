entry:
  id: study-ask-name
  kind: grammar
  note:
    Ask お名前は何ですか (おなまえはなんですか). Answer with your name + です, or 名前は～です. The names here are fictional examples;
    substitute your own name.
  tags:
    - Study guide
  level: N5
  title: 'Ask and answer: your name'
  topic: Grammar basics
  romaji: onamae wa nan desu ka
  meaning: 'Ask and answer: your name'
  reading: おなまえはなんですか。
  examples:
    - tokens:
        - { role: topic, text: お名前, reading: おなまえ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 何です, reading: なんです, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: What is your name?
      reading: おなまえはなんですか。
      japanese: お名前は何ですか。
      translationTokens:
        - { role: predicate, text: 'What is ' }
        - { role: topic, text: your name }
        - { role: particle, text: '?' }
    - tokens:
        - { role: predicate, text: アリです, reading: ありです, wordClass: predicate }
      meaning: My name is Ali.
      reading: ありです。
      japanese: アリです。
      translationTokens:
        - { role: implicit, text: My name, implicit: true }
        - { role: predicate, text: ' is Ali.' }
    - tokens:
        - { role: predicate, text: 田中です, reading: たなかです, wordClass: predicate }
      meaning: My name is Tanaka.
      reading: たなかです。
      japanese: 田中です。
      translationTokens:
        - { role: implicit, text: My name, implicit: true }
        - { role: predicate, text: ' is Tanaka.' }
    - tokens:
        - { role: predicate, text: ハナです, reading: はなです, wordClass: predicate }
      meaning: My name is Hana.
      reading: はなです。
      japanese: ハナです。
      translationTokens:
        - { role: implicit, text: My name, implicit: true }
        - { role: predicate, text: ' is Hana.' }
  japanese: お名前は何ですか。
  references:
    - rows:
        - - text: お名前は何ですか
            reading: おなまえはなんですか
          - text: アリです
            reading: ありです
      columns:
        - Question
        - Example answer
      heading: Name
