entry:
  id: study-existence
  kind: grammar
  note:
    'Use います for people and animals, and あります for things and plants. “Living/non-living” is only a rough
    shortcut: plants are biologically living but normally use あります. Use subject + が + existence verb. Location
    uses に, not で.'
  tags:
    - Study guide
  level: N5
  title: Existence — people and animals versus things
  topic: Grammar basics
  meaning: Existence — people and animals versus things
  reading: ねこがいます。
  examples:
    - tokens:
        - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: います, reading: います, wordClass: predicate }
      meaning: There is a cat.
      reading: ねこがいます。
      japanese: 猫がいます。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a cat. }
    - tokens:
        - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: あります, reading: あります, wordClass: predicate }
      meaning: There is a book.
      reading: ほんがあります。
      japanese: 本があります。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a book. }
    - tokens:
        - { role: subject, text: 先生, reading: せんせい, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: います, reading: います, wordClass: predicate }
      meaning: There is a teacher.
      reading: せんせいがいます。
      japanese: 先生がいます。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a teacher. }
    - tokens:
        - { role: subject, text: 花, reading: はな, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: あります, reading: あります, wordClass: predicate }
      meaning: There is a flower.
      reading: はながあります。
      japanese: 花があります。
      translationTokens:
        - { role: predicate, text: 'There is ' }
        - { role: subject, text: a flower. }
  japanese: 猫がいます。
  references:
    - rows:
        - - text: people / animals
            reading: ''
          - text: います
            reading: います
          - text: いません
            reading: いません
        - - text: things / plants
            reading: ''
          - text: あります
            reading: あります
          - text: ありません
            reading: ありません
      columns:
        - Use
        - Positive
        - Negative
      heading: Choose the existence verb
