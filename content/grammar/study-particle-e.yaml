entry:
  id: study-particle-e
  kind: grammar
  note:
    'へ is written he but pronounced e as a particle. It marks direction or a destination of movement. It is
    not limited to 行きます, 来ます, and 帰ります: 駅へ歩きます means “walk toward the station”. に also marks destinations with
    many movement verbs; で marks where an action happens. Do not replace every に with へ: specific times and
    existence locations use に.'
  tags:
    - Study guide
  level: N5
  title: へ — the e particle
  topic: Grammar basics
  romaji: e / he
  meaning: へ — the e particle
  reading: がっこうへいきます。
  examples:
    - tokens:
        - { role: modifier, text: 学校, reading: がっこう, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 行きます, reading: いきます, wordClass: predicate }
      meaning: I go to school.
      reading: がっこうへいきます。
      japanese: 学校へ行きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: go }
        - { role: modifier, text: ' to school.' }
    - tokens:
        - { role: modifier, text: 日本, reading: にほん, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 来ます, reading: きます, wordClass: predicate }
      meaning: I come to Japan.
      reading: にほんへきます。
      japanese: 日本へ来ます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: come }
        - { role: modifier, text: ' to Japan.' }
    - tokens:
        - { role: modifier, text: 家, reading: いえ, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 帰ります, reading: かえります, wordClass: predicate }
      meaning: I return home.
      reading: いえへかえります。
      japanese: 家へ帰ります。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: return }
        - { role: modifier, text: ' home.' }
    - tokens:
        - { role: modifier, text: 駅, reading: えき, wordClass: noun phrase }
        - { role: particle, text: へ, reading: へ, wordClass: particle }
        - { role: predicate, text: 歩きます, reading: あるきます, wordClass: predicate }
      meaning: I walk toward the station.
      reading: えきへあるきます。
      japanese: 駅へ歩きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: walk }
        - { role: modifier, text: ' toward the station.' }
  japanese: 学校へ行きます。
  references:
    - rows:
        - - text: へ
            reading: へ
          - text: e
            reading: ''
      columns:
        - Written
        - Said as
      heading: Spelling and particle pronunciation
