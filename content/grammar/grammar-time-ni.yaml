# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-time-ni
  kind: grammar
  note:
    'Use に after a specific clock time: 七時に. It is usually omitted after relative times such as 今日, 明日 and
    毎日. Seven o’clock is commonly しちじ; four o’clock is よじ and nine o’clock is くじ.'
  tags:
    - Grammar
    - time-ni
  level: N5
  title: 'Specific times: に'
  topic: Sentence building
  lesson:
    goal: Say at what clock time an action happens.
    group: Polite verbs and particles
    order: 10
    recap: Use に after a specific clock time; relative times such as 毎日 usually do not take に.
    examples:
      - tokens:
          - { role: modifier, text: 七時, reading: しちじ, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: predicate, text: 起きます, reading: おきます, wordClass: predicate }
        meaning: I get up at seven.
        reading: しちじにおきます。
        japanese: 七時に起きます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: get up }
          - { role: modifier, text: ' at seven.' }
      - tokens:
          - { role: modifier, text: 八時, reading: はちじ, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: predicate, text: 行きます, reading: いきます, wordClass: predicate }
        meaning: I go at eight.
        reading: はちじにいきます。
        japanese: 八時に行きます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: go }
          - { role: modifier, text: ' at eight.' }
      - tokens:
          - { role: modifier, text: 九時, reading: くじ, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: predicate, text: 勉強します, reading: べんきょうします, wordClass: predicate }
        meaning: I study at nine.
        reading: くじにべんきょうします。
        japanese: 九時に勉強します。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: study }
          - { role: modifier, text: ' at nine.' }
    comparison: Use に after a specific clock time; relative times such as 毎日 usually do not take に.
    vocabulary:
      - text: 七時
        meaning: seven o'clock
        reading: しちじ
      - text: 起きます
        meaning: get up
        reading: おきます
      - text: 八時
        meaning: eight o'clock
        reading: はちじ
      - text: 行きます
        meaning: go
        reading: いきます
      - text: 九時
        meaning: nine o'clock
        reading: くじ
      - text: 勉強します
        meaning: study
        reading: べんきょうします
      - text: 六時
        meaning: six o'clock
        reading: ろくじ
      - text: 帰ります
        meaning: return
        reading: かえります
    prerequisites:
      - grammar-masu
  meaning: I get up at seven.
  reading: しちじにおきます。
  examples:
    - tokens:
        - { role: modifier, text: 七時に, reading: しちじに, wordClass: time noun + particle }
        - { role: predicate, text: 起きます, reading: おきます, wordClass: verb }
      meaning: I get up at seven.
      reading: しちじにおきます。
      japanese: 七時に起きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: get up, implicit: false }
        - { role: modifier, text: ' at seven.', implicit: false }
  exercise:
    prompt: 'Fill the missing particle: 七時 __ 起きます。'
    answers:
      - に
    explanation:
      'Use に after a specific clock time: 七時に. It is usually omitted after relative times such as 今日,
      明日 and 毎日. Seven o’clock is commonly しちじ; four o’clock is よじ and nine o’clock is くじ.'
  japanese: 七時に起きます。
