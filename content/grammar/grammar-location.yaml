# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-location
  kind: grammar
  note:
    'Place + に marks where something exists with あります / います. Place + で instead marks where an action
    happens. For describing an already-known cat: 猫は部屋にいます.'
  tags:
    - Grammar
    - location
  level: N5
  title: 'Location of existence: に'
  topic: Sentence building
  lesson:
    goal: Locate a thing, person, or animal.
    group: Existence and location
    order: 13
    recap: に marks the location of existence; で marks the location of an action.
    examples:
      - tokens:
          - { role: modifier, text: 部屋, reading: へや, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: います, reading: います, wordClass: predicate }
        meaning: There is a cat in the room.
        reading: へやにねこがいます。
        japanese: 部屋に猫がいます。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a cat }
          - { role: modifier, text: ' in the room.' }
      - tokens:
          - { role: modifier, text: 学校, reading: がっこう, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: subject, text: 先生, reading: せんせい, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: います, reading: います, wordClass: predicate }
        meaning: There is a teacher at school.
        reading: がっこうにせんせいがいます。
        japanese: 学校に先生がいます。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a teacher }
          - { role: modifier, text: ' at school.' }
      - tokens:
          - { role: modifier, text: 家, reading: いえ, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: あります, reading: あります, wordClass: predicate }
        meaning: There is a book at home.
        reading: いえにほんがあります。
        japanese: 家に本があります。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a book }
          - { role: modifier, text: ' at home.' }
    comparison: に marks the location of existence; で marks the location of an action.
    vocabulary:
      - text: 部屋
        meaning: room
        reading: へや
      - text: 猫
        meaning: cat
        reading: ねこ
      - text: 学校
        meaning: school
        reading: がっこう
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 家
        meaning: home / house
        reading: いえ
      - text: 本
        meaning: book
        reading: ほん
      - text: 机
        meaning: desk
        reading: つくえ
    prerequisites:
      - grammar-arimasu
      - grammar-imasu
  meaning: There is a cat in the room.
  reading: へやにねこがいます。
  examples:
    - tokens:
        - {
            role: modifier,
            text: 部屋に,
            reading: へやに,
            wordClass: place noun + location particle,
          }
        - { role: subject, text: 猫, reading: ねこ, wordClass: noun }
        - { role: particle, text: が, reading: が, wordClass: subject particle }
        - { role: predicate, text: います, reading: います, wordClass: existence verb }
      meaning: There is a cat in the room.
      reading: へやにねこがいます。
      japanese: 部屋に猫がいます。
      translationTokens:
        - { role: predicate, text: 'There is ', implicit: false }
        - { role: subject, text: a cat, implicit: false }
        - { role: modifier, text: ' in the room.', implicit: false }
  exercise:
    tiles:
      - 部屋
      - に
      - 猫
      - が
      - います
    prompt: 'Build: “There is a cat in the room.” Start with 部屋に.'
    answers:
      - 部屋に猫がいます
      - へやにねこがいます
    explanation:
      'Place + に marks where something exists with あります / います. Place + で instead marks where an action
      happens. For describing an already-known cat: 猫は部屋にいます.'
  japanese: 部屋に猫がいます。
