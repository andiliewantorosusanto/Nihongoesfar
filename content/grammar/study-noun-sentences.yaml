# Grammar source. Run npm run content:build after editing.
entry:
  id: study-noun-sentences
  kind: grammar
  note:
    'Use noun A + は + noun B + です to identify or describe A. は is pronounced “wa”. Nouns use でした for polite
    past; do not add the verb ending ます. じゃ is the contracted form of では. Both じゃありません and ではありません are polite
    negatives. これ / それ / あれ stand alone; この / その / あの must come before a noun. どれ asks which item among
    several choices: どれがあなたのペンですか (どれがあなたのぺんですか). Use が after どれ in this question. の connects an owner or
    related noun to the following noun: 私の車 (わたしのくるま).'
  tags:
    - Study guide
  level: N5
  title: 'Noun sentences: present, past, negatives, and questions'
  topic: Sentence basics
  meaning: 'Noun sentences: present, past, negatives, and questions'
  reading: それはわたしのくるまです。
  examples:
    - tokens:
        - { role: topic, text: それ, reading: それ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: modifier, text: 私, reading: わたし, wordClass: noun phrase }
        - { role: particle, text: の, reading: の, wordClass: particle }
        - { role: predicate, text: 車, reading: くるま, wordClass: predicate }
        - { role: predicate, text: です, reading: です, wordClass: predicate }
      meaning: That is my car.
      reading: それはわたしのくるまです。
      japanese: それは私の車です。
      translationTokens:
        - { role: topic, text: That }
        - { role: predicate, text: ' is ' }
        - { role: modifier, text: my }
        - { role: predicate, text: ' car.' }
    - tokens:
        - { role: topic, text: あれ, reading: あれ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: modifier, text: キムさん, reading: きむさん, wordClass: noun phrase }
        - { role: particle, text: の, reading: の, wordClass: particle }
        - { role: predicate, text: 車, reading: くるま, wordClass: predicate }
        - { role: predicate, text: じゃありません, reading: じゃありません, wordClass: predicate }
      meaning: That is not Kim's car.
      reading: あれはきむさんのくるまじゃありません。
      japanese: あれはキムさんの車じゃありません。
      translationTokens:
        - { role: topic, text: That }
        - { role: predicate, text: ' is not ' }
        - { role: modifier, text: Kim's }
        - { role: predicate, text: ' car.' }
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 建物, reading: たてもの, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 病院, reading: びょういん, wordClass: predicate }
        - { role: predicate, text: でした, reading: でした, wordClass: predicate }
      meaning: This building was a hospital.
      reading: このたてものはびょういんでした。
      japanese: この建物は病院でした。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: building }
        - { role: predicate, text: ' was a hospital.' }
    - tokens:
        - { role: topic, text: Aビル, reading: えーびる, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学校, reading: がっこう, wordClass: predicate }
        - {
            role: predicate,
            text: じゃありませんでした,
            reading: じゃありませんでした,
            wordClass: predicate,
          }
      meaning: Building A was not a school.
      reading: えーびるはがっこうじゃありませんでした。
      japanese: Aビルは学校じゃありませんでした。
      translationTokens:
        - { role: topic, text: Building A }
        - { role: predicate, text: ' was not a school.' }
  japanese: それは私の車です。
  references:
    - rows:
        - - text: Present
            reading: ''
          - text: 学生です
            reading: がくせいです
          - text: 学生だ
            reading: がくせいだ
          - text: am / is a student
            reading: ''
        - - text: Negative
            reading: ''
          - text: 学生じゃありません
            reading: がくせいじゃありません
          - text: 学生じゃない
            reading: がくせいじゃない
          - text: am / is not a student
            reading: ''
        - - text: Past
            reading: ''
          - text: 学生でした
            reading: がくせいでした
          - text: 学生だった
            reading: がくせいだった
          - text: was a student
            reading: ''
        - - text: Negative past
            reading: ''
          - text: 学生じゃありませんでした
            reading: がくせいじゃありませんでした
          - text: 学生じゃなかった
            reading: がくせいじゃなかった
          - text: was not a student
            reading: ''
      columns:
        - Form
        - Polite
        - Casual
        - Meaning
      heading: 'Noun endings: polite and casual together'
    - rows:
        - - text: これ
            reading: これ
          - text: これはボールペンです
            reading: これはぼーるぺんです
          - text: This is a ballpoint pen (near me).
            reading: ''
        - - text: それ
            reading: それ
          - text: それは私の車です
            reading: それはわたしのくるまです
          - text: That is my car (near you).
            reading: ''
        - - text: あれ
            reading: あれ
          - text: あれはエアコンです
            reading: あれはえあこんです
          - text: That is an air conditioner (away from both of us).
            reading: ''
        - - text: どれ
            reading: どれ
          - text: どれがあなたのペンですか
            reading: どれがあなたのぺんですか
          - text: Which one is your pen?
            reading: ''
        - - text: noun + の + noun
            reading: ''
          - text: キムさんの車
            reading: きむさんのくるま
          - text: Kim's car
            reading: ''
      columns:
        - Word / pattern
        - Example
        - Meaning
      heading: Pointing words and possession
    - rows:
        - - text: 田中さんは学生ですか
            reading: たなかさんはがくせいですか
          - text: はい、学生です
            reading: はい、がくせいです
          - text: いいえ、学生じゃありません
            reading: いいえ、がくせいじゃありません
        - - text: この建物は病院でしたか
            reading: このたてものはびょういんでしたか
          - text: はい、病院でした
            reading: はい、びょういんでした
          - text: いいえ、病院じゃありませんでした
            reading: いいえ、びょういんじゃありませんでした
      columns:
        - Question
        - Yes
        - No
      heading: Ask and answer
