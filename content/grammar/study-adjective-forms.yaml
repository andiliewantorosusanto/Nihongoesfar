# Grammar source. Run npm run content:build after editing.
entry:
  id: study-adjective-forms
  kind: grammar
  note:
    'For い-adjectives, replace final い with くない, かった, or くなかった. Add です to make these forms polite; do not
    add だ after an い-adjective. For な-adjectives and nouns, change the ending instead: だ / です, じゃない / じゃありません,
    だった / でした, じゃなかった / じゃありませんでした. では is a more formal alternative to じゃ. くありません and くありませんでした are also
    polite い-adjective negatives. いい is irregular: よくない, よかった, よくなかった. きれい and 嫌い (きらい) are な-adjectives even
    though they end in い.'
  tags:
    - Study guide
    - Adjective guide
  level: N5
  title: 'い / な adjectives: present, past, and negatives'
  topic: Adjectives and noun descriptions
  meaning: 'い / な adjectives: present, past, and negatives'
  reading: きょうはあつくないです。
  examples:
    - tokens:
        - { role: topic, text: 今日, reading: きょう, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 暑くないです, reading: あつくないです, wordClass: predicate }
      meaning: Today is not hot.
      reading: きょうはあつくないです。
      japanese: 今日は暑くないです。
      translationTokens:
        - { role: topic, text: Today }
        - { role: predicate, text: ' is not hot.' }
    - tokens:
        - { role: topic, text: 昨日, reading: きのう, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 元気でした, reading: げんきでした, wordClass: predicate }
      meaning: I was well yesterday.
      reading: きのうはげんきでした。
      japanese: 昨日は元気でした。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: was well }
        - { role: topic, text: ' yesterday.' }
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 料理, reading: りょうり, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - {
            role: predicate,
            text: おいしくなかったです,
            reading: おいしくなかったです,
            wordClass: predicate,
          }
      meaning: This dish was not delicious.
      reading: このりょうりはおいしくなかったです。
      japanese: この料理はおいしくなかったです。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: dish }
        - { role: predicate, text: ' was not delicious.' }
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 部屋, reading: へや, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - {
            role: predicate,
            text: きれいじゃなかったです,
            reading: きれいじゃなかったです,
            wordClass: predicate,
          }
      meaning: This room was not clean.
      reading: このへやはきれいじゃなかったです。
      japanese: この部屋はきれいじゃなかったです。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: room }
        - { role: predicate, text: ' was not clean.' }
  japanese: 今日は暑くないです。
  references:
    - rows:
        - - text: Present · polite
            reading: ''
          - text: 暑いです
            reading: あついです
          - text: 元気です
            reading: げんきです
          - text: 雨です
            reading: あめです
        - - text: Present · casual
            reading: ''
          - text: 暑い
            reading: あつい
          - text: 元気だ
            reading: げんきだ
          - text: 雨だ
            reading: あめだ
        - - text: Negative · polite
            reading: ''
          - text: 暑くないです
            reading: あつくないです
          - text: 元気じゃありません
            reading: げんきじゃありません
          - text: 雨じゃありません
            reading: あめじゃありません
        - - text: Negative · casual
            reading: ''
          - text: 暑くない
            reading: あつくない
          - text: 元気じゃない
            reading: げんきじゃない
          - text: 雨じゃない
            reading: あめじゃない
        - - text: Past · polite
