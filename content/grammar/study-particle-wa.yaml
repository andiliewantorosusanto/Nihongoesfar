entry:
  id: study-particle-wa
  kind: grammar
  note:
    'は is written ha but pronounced wa when it is a particle. It sets the topic: “As for ...”. It can
    contrast topics. It is not automatically the grammatical subject.'
  tags:
    - Study guide
  level: N5
  title: は — the wa particle
  topic: Grammar basics
  romaji: wa / ha
  meaning: は — the wa particle
  reading: わたしはがくせいです。
  examples:
    - tokens:
        - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学生です, reading: がくせいです, wordClass: predicate }
      meaning: I am a student.
      reading: わたしはがくせいです。
      japanese: 私は学生です。
      translationTokens:
        - { role: topic, text: I }
        - { role: predicate, text: ' am a student.' }
    - tokens:
        - { role: topic, text: 母, reading: はは, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 先生です, reading: せんせいです, wordClass: predicate }
      meaning: My mother is a teacher.
      reading: はははせんせいです。
      japanese: 母は先生です。
      translationTokens:
        - { role: topic, text: My mother }
        - { role: predicate, text: ' is a teacher.' }
    - tokens:
        - { role: topic, text: 今日, reading: きょう, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 休みです, reading: やすみです, wordClass: predicate }
      meaning: Today is a day off.
      reading: きょうはやすみです。
      japanese: 今日は休みです。
      translationTokens:
        - { role: topic, text: Today }
        - { role: predicate, text: ' is a day off.' }
    - tokens:
        - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
      meaning: This is a book.
      reading: これはほんです。
      japanese: これは本です。
      translationTokens:
        - { role: topic, text: This }
        - { role: predicate, text: ' is a book.' }
  japanese: 私は学生です。
  references:
    - rows:
        - - text: は
            reading: は
          - text: wa
            reading: ''
      columns:
        - Written
        - Said as
      heading: Spelling and particle pronunciation
