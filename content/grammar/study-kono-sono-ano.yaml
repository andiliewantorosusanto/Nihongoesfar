entry:
  id: study-kono-sono-ano
  kind: grammar
  note:
    この / その / あの must be followed by a noun. この本 means “this book”; この alone cannot replace これ. The near-me
    / near-you / far-from-both distinction is the same.
  tags:
    - Study guide
  level: N5
  title: この・その・あの — before a noun
  topic: Grammar basics
  romaji: kono / sono / ano
  meaning: この・その・あの — before a noun
  reading: このほんはわたしのです。
  examples:
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 本, reading: ほん, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 私のです, reading: わたしのです, wordClass: predicate }
      meaning: This book is mine.
      reading: このほんはわたしのです。
      japanese: この本は私のです。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: book }
        - { role: predicate, text: ' is mine.' }
    - tokens:
        - { role: modifier, text: その, reading: その, wordClass: noun phrase }
        - { role: topic, text: 時計, reading: とけい, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 先生のです, reading: せんせいのです, wordClass: predicate }
      meaning: That clock is the teacher's.
      reading: そのとけいはせんせいのです。
      japanese: その時計は先生のです。
      translationTokens:
        - { role: modifier, text: 'That ' }
        - { role: topic, text: clock }
        - { role: predicate, text: " is the teacher's." }
    - tokens:
        - { role: modifier, text: あの, reading: あの, wordClass: noun phrase }
        - { role: topic, text: 車, reading: くるま, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 母のです, reading: ははのです, wordClass: predicate }
      meaning: That car over there is my mother's.
      reading: あのくるまはははのです。
      japanese: あの車は母のです。
      translationTokens:
        - { role: modifier, text: 'That ' }
        - { role: topic, text: car }
        - { role: modifier, text: ' over there' }
        - { role: predicate, text: " is my mother's." }
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: かばん, reading: かばん, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 私のです, reading: わたしのです, wordClass: predicate }
      meaning: This bag is mine.
      reading: このかばんはわたしのです。
      japanese: このかばんは私のです。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: bag }
        - { role: predicate, text: ' is mine.' }
  japanese: この本は私のです。
  references:
    - rows:
        - - text: この
            reading: この
          - text: この本
            reading: このほん
        - - text: その
            reading: その
          - text: その時計
