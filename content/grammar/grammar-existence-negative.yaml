# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-existence-negative
  kind: grammar
  note:
    The negative of あります is ありません; the negative of います is いません. 時間がありません means there is no time / I do not
    have time. 私は学生じゃありません instead negates the noun predicate “student”.
  tags:
    - Grammar
    - existence-negative
  level: N5
  title: 'Negative existence: ありません・いません'
  topic: Sentence building
  lesson:
    goal: Say that something or someone is absent.
    group: Negatives and past
    order: 18
    recap: ありません negates あります; いません negates います. Noun + じゃありません means “is not”, not “is absent”.
    examples:
      - tokens:
          - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: ありません, reading: ありません, wordClass: predicate }
        meaning: There is no book.
        reading: ほんがありません。
        japanese: 本がありません。
        translationTokens:
          - { role: predicate, text: 'There is no ' }
          - { role: subject, text: book. }
      - tokens:
          - { role: subject, text: 机, reading: つくえ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: ありません, reading: ありません, wordClass: predicate }
        meaning: There is no desk.
        reading: つくえがありません。
        japanese: 机がありません。
        translationTokens:
          - { role: predicate, text: 'There is no ' }
          - { role: subject, text: desk. }
      - tokens:
          - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: いません, reading: いません, wordClass: predicate }
        meaning: There is no cat.
        reading: ねこがいません。
        japanese: 猫がいません。
        translationTokens:
          - { role: predicate, text: 'There is no ' }
          - { role: subject, text: cat. }
    comparison: ありません negates あります; いません negates います. Noun + じゃありません means “is not”, not “is absent”.
    vocabulary:
      - text: 本
        meaning: book
        reading: ほん
      - text: 机
        meaning: desk
        reading: つくえ
      - text: 猫
        meaning: cat
        reading: ねこ
      - text: 先生
        meaning: teacher
        reading: せんせい
    prerequisites:
      - grammar-arimasu
      - grammar-imasu
  meaning: I do not have time.
  reading: じかんがありません。
  examples:
    - tokens:
        - { role: subject, text: 時間, reading: じかん, wordClass: noun }
        - { role: particle, text: が, reading: が, wordClass: subject particle }
        - {
            role: predicate,
            text: ありません,
            reading: ありません,
            wordClass: negative existence verb,
          }
      meaning: I do not have time.
      reading: じかんがありません。
      japanese: 時間がありません。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'do not have ', implicit: false }
        - { role: subject, text: time., implicit: false }
  exercise:
    tiles:
      - 時間
      - が
      - ありません
    prompt: 'Build: “I do not have time.” Use 時間が.'
    answers:
      - 時間がありません
      - じかんがありません
    explanation:
      The negative of あります is ありません; the negative of います is いません. 時間がありません means there is no time / I
      do not have time. 私は学生じゃありません instead negates the noun predicate “student”.
  japanese: 時間がありません。
