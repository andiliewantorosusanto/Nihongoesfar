entry:
  id: study-adjective-joining
  kind: grammar
  note:
    To connect compatible descriptions, change an い-adjective’s final い to くて; add で to a な-adjective or
    noun. いい becomes よくて. Choose the connector from the first description, even when the next word is a
    different adjective type. The last predicate carries the sentence’s tense and politeness. Use these
    patterns for “and”; use が or けど when contrasting descriptions.
  tags:
    - Study guide
    - Adjective guide
  level: N5
  title: 'Connect descriptions: ～くて / ～で'
  topic: Adjectives and noun descriptions
  meaning: 'Connect descriptions: ～くて / ～で'
  reading: このりょうりはおいしくてやすいです。
  examples:
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 料理, reading: りょうり, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: おいしくて, reading: おいしくて, wordClass: predicate }
        - { role: predicate, text: 安いです, reading: やすいです, wordClass: predicate }
      meaning: This dish is delicious and inexpensive.
      reading: このりょうりはおいしくてやすいです。
      japanese: この料理はおいしくて安いです。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: dish }
        - { role: predicate, text: ' is delicious and ' }
        - { role: predicate, text: inexpensive. }
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 町, reading: まち, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 有名で, reading: ゆうめいで, wordClass: predicate }
        - { role: predicate, text: にぎやかです, reading: にぎやかです, wordClass: predicate }
      meaning: This town is famous and lively.
      reading: このまちはゆうめいでにぎやかです。
      japanese: この町は有名でにぎやかです。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: town }
        - { role: predicate, text: ' is famous and ' }
        - { role: predicate, text: lively. }
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: noun phrase }
        - { role: topic, text: 料理, reading: りょうり, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: おいしくて, reading: おいしくて, wordClass: predicate }
        - { role: predicate, text: 有名です, reading: ゆうめいです, wordClass: predicate }
      meaning: This dish is delicious and famous.
      reading: このりょうりはおいしくてゆうめいです。
      japanese: この料理はおいしくて有名です。
      translationTokens:
        - { role: modifier, text: 'This ' }
        - { role: topic, text: dish }
        - { role: predicate, text: ' is delicious and ' }
        - { role: predicate, text: famous. }
    - tokens:
        - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学生で, reading: がくせいで, wordClass: predicate }
        - { role: predicate, text: 親切です, reading: しんせつです, wordClass: predicate }
      meaning: Tanaka is a student and kind.
      reading: たなかさんはがくせいでしんせつです。
