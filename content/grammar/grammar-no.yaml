# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-no
  kind: grammar
  note:
    Noun A + の + noun B links the nouns. It may express ownership (私の本), affiliation (学校の先生), or another
    relationship. の follows the possessor, unlike English apostrophe placement.
  tags:
    - Grammar
    - no
  level: N5
  title: 'Possession and connection: の'
  topic: Sentence building
  lesson:
    goal: Say who something belongs to.
    group: Sentence basics
    order: 3
    recap: The owner comes before の, and the owned thing comes after it.
    examples:
      - tokens:
          - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: modifier, text: 私, reading: わたし, wordClass: modifier }
          - { role: particle, text: の, reading: の, wordClass: particle }
          - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
        meaning: This is my book.
        reading: これはわたしのほんです。
        japanese: これは私の本です。
        translationTokens:
          - { role: topic, text: This }
          - { role: predicate, text: ' is ' }
          - { role: modifier, text: my }
          - { role: predicate, text: ' book.' }
      - tokens:
          - { role: topic, text: それ, reading: それ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: modifier, text: 先生, reading: せんせい, wordClass: modifier }
          - { role: particle, text: の, reading: の, wordClass: particle }
          - { role: predicate, text: 時計です, reading: とけいです, wordClass: predicate }
        meaning: That is the teacher's clock.
        reading: それはせんせいのとけいです。
        japanese: それは先生の時計です。
        translationTokens:
          - { role: topic, text: That }
          - { role: predicate, text: ' is ' }
          - { role: modifier, text: the teacher's }
          - { role: predicate, text: ' clock.' }
      - tokens:
          - { role: topic, text: あれ, reading: あれ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: modifier, text: 田中さん, reading: たなかさん, wordClass: modifier }
          - { role: particle, text: の, reading: の, wordClass: particle }
          - { role: predicate, text: 車です, reading: くるまです, wordClass: predicate }
        meaning: That is Tanaka's car over there.
        reading: あれはたなかさんのくるまです。
        japanese: あれは田中さんの車です。
        translationTokens:
          - { role: topic, text: That }
          - { role: predicate, text: ' is ' }
          - { role: modifier, text: Tanaka's }
          - { role: predicate, text: ' car over there.' }
    comparison: The owner comes before の, and the owned thing comes after it.
    vocabulary:
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 本
        meaning: book
        reading: ほん
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 時計
        meaning: clock / watch
        reading: とけい
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: 車
        meaning: car
        reading: くるま
      - text: 母
        meaning: my mother
        reading: はは
      - text: かばん
        meaning: bag
        reading: かばん
    prerequisites:
      - grammar-desu
      - grammar-question
  meaning: This is my book.
  reading: これはわたしのほんです。
  examples:
    - tokens:
        - { role: topic, text: これ, reading: これ, wordClass: demonstrative pronoun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: modifier, text: 私の, reading: わたしの, wordClass: pronoun + particle }
        - { role: predicate, text: 本です, reading: ほんです, wordClass: noun + copula }
      meaning: This is my book.
      reading: これはわたしのほんです。
      japanese: これは私の本です。
      translationTokens:
        - { role: topic, text: This, implicit: false }
        - { role: predicate, text: ' is ', implicit: false }
        - { role: modifier, text: my, implicit: false }
        - { role: predicate, text: ' book.', implicit: false }
  exercise:
    tiles:
      - これ
      - は
      - 私
      - の
      - 本
      - です
    prompt: 'Build: “This is my book.”'
    answers:
      - これは私の本です
      - これはわたしのほんです
    explanation:
      Noun A + の + noun B links the nouns. It may express ownership (私の本), affiliation (学校の先生), or
      another relationship. の follows the possessor, unlike English apostrophe placement.
  japanese: これは私の本です。
