entry:
  id: study-kore-sore-are
  kind: grammar
  note:
    これ is near the speaker; それ is near the listener or refers to something just mentioned; あれ is away from
    both. These words stand alone. Use この / その / あの directly before a noun.
  tags:
    - Study guide
  level: N5
  title: これ・それ・あれ — this, that, that over there
  topic: Grammar basics
  romaji: kore / sore / are
  meaning: これ・それ・あれ — this, that, that over there
  reading: これはほんです。
  examples:
    - tokens:
        - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
      meaning: This is a book.
      reading: これはほんです。
      japanese: これは本です。
      translationTokens:
        - { role: topic, text: This }
        - { role: predicate, text: ' is a book.' }
    - tokens:
        - { role: topic, text: それ, reading: それ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 時計です, reading: とけいです, wordClass: predicate }
      meaning: That is a clock.
      reading: それはとけいです。
      japanese: それは時計です。
      translationTokens:
        - { role: topic, text: That }
        - { role: predicate, text: ' is a clock.' }
    - tokens:
        - { role: topic, text: あれ, reading: あれ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学校です, reading: がっこうです, wordClass: predicate }
      meaning: That over there is a school.
      reading: あれはがっこうです。
      japanese: あれは学校です。
      translationTokens:
        - { role: topic, text: That over there }
        - { role: predicate, text: ' is a school.' }
    - tokens:
        - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 何です, reading: なんです, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: What is this?
      reading: これはなんですか。
      japanese: これは何ですか。
      translationTokens:
        - { role: predicate, text: 'What is ' }
        - { role: topic, text: this }
        - { role: particle, text: '?' }
  japanese: これは本です。
  references:
    - rows:
        - - text: これ
            reading: これ
          - text: this (near me)
            reading: ''
        - - text: それ
            reading: それ
          - text: that (near you / just mentioned)
            reading: ''
        - - text: あれ
            reading: あれ
          - text: that over there (away from both)
            reading: ''
      columns:
        - Word
        - Meaning
      heading: Stand-alone pointing words
