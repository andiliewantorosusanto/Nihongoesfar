exercises:
  - id: meaning
    type: meaning-choice
    sentence: what-is-your-hobby
    choices:
      - text: What is your hobby?
        reading: ''
      - text: My hobby is reading.
        reading: ''
      - text: My hobby is cooking.
        reading: ''
      - text: My hobby is music.
        reading: ''
    answers:
      - What is your hobby?
  - id: pattern
    type: pattern-choice
    sentence: my-hobby-is-reading
    choices:
      - sentence: what-is-your-hobby
      - sentence: my-hobby-is-reading
    prompt: 'Choose the Japanese: My hobby is reading.'
    answers:
      - 趣味は読書です
      - 趣味はどくしょです
      - しゅみは読書です
      - しゅみはどくしょです
