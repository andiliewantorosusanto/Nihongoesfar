entry:
  id: study-ask-hobby
  kind: grammar
  note:
    Ask 趣味は何ですか or the polite ご趣味は何ですか (ごしゅみはなんですか). Answer 趣味は～です. Use a noun such as 読書 (reading) or 料理
    (cooking).
  tags:
    - Study guide
  level: N5
  title: 'Ask and answer: your hobby'
  topic: Grammar basics
  romaji: goshumi wa nan desu ka
  meaning: 'Ask and answer: your hobby'
  reading: ごしゅみはなんですか。
  examples:
    - tokens:
        - { role: topic, text: ご趣味, reading: ごしゅみ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 何です, reading: なんです, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: What is your hobby?
      reading: ごしゅみはなんですか。
      japanese: ご趣味は何ですか。
      translationTokens:
        - { role: predicate, text: 'What is ' }
        - { role: topic, text: your hobby }
        - { role: particle, text: '?' }
    - tokens:
        - { role: topic, text: 趣味, reading: しゅみ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 読書です, reading: どくしょです, wordClass: predicate }
      meaning: My hobby is reading.
      reading: しゅみはどくしょです。
      japanese: 趣味は読書です。
      translationTokens:
        - { role: topic, text: My hobby }
        - { role: predicate, text: ' is reading.' }
    - tokens:
        - { role: topic, text: 趣味, reading: しゅみ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 料理です, reading: りょうりです, wordClass: predicate }
      meaning: My hobby is cooking.
      reading: しゅみはりょうりです。
      japanese: 趣味は料理です。
      translationTokens:
        - { role: topic, text: My hobby }
        - { role: predicate, text: ' is cooking.' }
    - tokens:
        - { role: topic, text: 趣味, reading: しゅみ, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 音楽です, reading: おんがくです, wordClass: predicate }
      meaning: My hobby is music.
      reading: しゅみはおんがくです。
      japanese: 趣味は音楽です。
      translationTokens:
        - { role: topic, text: My hobby }
        - { role: predicate, text: ' is music.' }
  japanese: ご趣味は何ですか。
  references:
    - rows:
        - - text: 読書
            reading: どくしょ
          - text: reading
            reading: ''
        - - text: 料理
            reading: りょうり
          - text: cooking
            reading: ''
        - - text: 音楽
            reading: おんがく
