# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-verb-past
  kind: grammar
  note:
    'Replace ます with ました for past affirmative and with ませんでした for past negative: 買います → 買いました / 買いませんでした.
    Noun and adjective past forms follow other patterns.'
  tags:
    - Grammar
    - verb-past
  level: N5
  title: Polite verb past
  topic: Sentence building
  lesson:
    goal: Describe a completed action politely.
    group: Negatives and past
    order: 17
    recap: Replace ます with ました for past actions; noun + でした follows a different pattern.
    examples:
      - tokens:
          - { role: modifier, text: 昨日, reading: きのう, wordClass: modifier }
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読みました, reading: よみました, wordClass: predicate }
        meaning: I read a book yesterday.
        reading: きのうほんをよみました。
        japanese: 昨日本を読みました。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'read ' }
          - { role: object, text: a book }
          - { role: modifier, text: ' yesterday.' }
      - tokens:
          - { role: modifier, text: 昨日, reading: きのう, wordClass: modifier }
          - { role: object, text: 水, reading: みず, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 飲みました, reading: のみました, wordClass: predicate }
        meaning: I drank water yesterday.
        reading: きのうみずをのみました。
        japanese: 昨日水を飲みました。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'drank ' }
          - { role: object, text: water }
          - { role: modifier, text: ' yesterday.' }
      - tokens:
          - { role: modifier, text: 昨日, reading: きのう, wordClass: modifier }
          - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 食べました, reading: たべました, wordClass: predicate }
        meaning: I ate bread yesterday.
        reading: きのうぱんをたべました。
        japanese: 昨日パンを食べました。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'ate ' }
          - { role: object, text: bread }
          - { role: modifier, text: ' yesterday.' }
    comparison: Replace ます with ました for past actions; noun + でした follows a different pattern.
    vocabulary:
      - text: 昨日
        meaning: yesterday
        reading: きのう
      - text: 本
        meaning: book
        reading: ほん
      - text: 読みました
        meaning: read (past)
        reading: よみました
      - text: 水
        meaning: water
        reading: みず
      - text: 飲みました
        meaning: drank
        reading: のみました
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べました
        meaning: ate
        reading: たべました
      - text: 学校
        meaning: school
        reading: がっこう
      - text: 行きました
        meaning: went
        reading: いきました
    prerequisites:
      - grammar-masu
      - grammar-masen
  meaning: I bought a book yesterday.
  reading: きのうほんをかいました。
  examples:
    - tokens:
        - { role: modifier, text: 昨日, reading: きのう, wordClass: time noun }
        - { role: object, text: 本, reading: ほん, wordClass: noun }
        - { role: particle, text: を, reading: を, wordClass: object particle }
        - { role: predicate, text: 買いました, reading: かいました, wordClass: past verb }
      meaning: I bought a book yesterday.
      reading: きのうほんをかいました。
      japanese: 昨日本を買いました。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: bought, implicit: false }
        - { role: object, text: ' a book', implicit: false }
        - { role: modifier, text: ' yesterday.', implicit: false }
  exercise:
    tiles:
      - 昨日
      - 本
      - を
      - 買いました
    prompt: 'Build: “I bought a book yesterday.” Start with 昨日.'
    answers:
      - 昨日本を買いました
      - きのうほんをかいました
    explanation:
      'Replace ます with ました for past affirmative and with ませんでした for past negative: 買います → 買いました /
      買いませんでした. Noun and adjective past forms follow other patterns.'
  japanese: 昨日本を買いました。
