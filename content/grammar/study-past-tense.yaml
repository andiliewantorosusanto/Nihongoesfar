sentences:
  yesterday-was-a-day-off:
    text: 昨日は休みでした。
    reading: きのうはやすみでした。
    meaning: Yesterday was a day off.
    tokens:
      - { text: 昨日, reading: きのう, role: modifier, wordClass: noun phrase }
      - { text: は, reading: は, role: particle, wordClass: particle }
      - { text: 休みでした, reading: やすみでした, role: predicate, wordClass: predicate }
    translationTokens:
      - { text: Yesterday, role: modifier }
      - { text: ' was a day off.', role: predicate }
    hint: Check both the time word and the noun before the ending.
    explanation:
      '昨日 (きのう) means “yesterday”; 休み (やすみ) means “a day off”. でした makes this a polite past statement:
      “Yesterday was a day off.” There is no negative ending here.'
  i-did-not-eat-bread:
    text: パンを食べなかった。
    reading: ぱんをたべなかった。
    meaning: I did not eat bread.
    tokens:
      - { text: パン, reading: ぱん, role: object, wordClass: noun phrase }
      - { text: を, reading: を, role: particle, wordClass: particle }
      - { text: 食べなかった, reading: たべなかった, role: predicate, wordClass: predicate }
    translationTokens:
      - { text: 'I ', role: implicit, implicit: true }
      - { text: 'did not eat ', role: predicate }
      - { text: bread., role: object }
    hint: Check the food word and whether the verb is affirmative, negative, or past.
    explanation:
      'パン means “bread”, and を marks what is eaten. 食べなかった (たべなかった) is the casual past negative of 食べる
      (たべる): “did not eat”. 食べた means “ate”; 食べない means “do not eat”.'
    form: casual
  yesterday-was-not-hot:
    text: 昨日は暑くなかったです。
    reading: きのうはあつくなかったです。
    meaning: Yesterday was not hot.
    tokens:
      - { text: 昨日, reading: きのう, role: topic, wordClass: noun phrase }
      - { text: は, reading: は, role: particle, wordClass: particle }
      - {
          text: 暑くなかったです,
          reading: あつくなかったです,
          role: predicate,
          wordClass: predicate,
        }
    translationTokens:
      - { text: Yesterday, role: topic }
      - { text: ' was not hot.', role: predicate }
    form: polite
    hint: Check the time word, the negative ending, and whether this is a question.
    explanation:
      昨日 (きのう) sets the time to yesterday. 暑い (あつい), “hot”, becomes 暑くなかった (あつくなかった), “was not hot”; です
      makes the sentence polite.
  was-tanaka-well:
    text: 田中さんは元気でしたか。
    reading: たなかさんはげんきでしたか。
    meaning: Was Tanaka well?
    tokens:
      - { text: 田中さん, reading: たなかさん, role: topic, wordClass: noun phrase }
      - { text: は, reading: は, role: particle, wordClass: particle }
      - { text: 元気でした, reading: げんきでした, role: predicate, wordClass: predicate }
      - { text: か, reading: か, role: particle, wordClass: particle }
    translationTokens:
      - { text: 'Was ', role: predicate }
      - { text: Tanaka, role: topic }
      - { text: ' well', role: predicate }
      - { text: '?', role: particle }
    form: polite
    hint: Check the time word, the negative ending, and whether this is a question.
    explanation:
      '元気 (げんき) means “well”. でした places it in the past, and final か makes a polite question: “Was
      Tanaka well?”'
  last-week-was-a-day-off:
    tokens:
      - { role: modifier, text: 先週, reading: せんしゅう, wordClass: noun phrase }
      - { role: particle, text: は, reading: は, wordClass: particle }
      - { role: predicate, text: 休みでした, reading: やすみでした, wordClass: predicate }
    meaning: Last week was a day off.
    reading: せんしゅうはやすみでした。
    translationTokens:
      - { role: modifier, text: Last week }
      - { role: predicate, text: ' was a day off.' }
    text: 先週は休みでした。
    hint: Check the particles and sentence ending.
    explanation:
      先週は休みでした。 means “Last week was a day off.” Match the vocabulary, particles, and tense to the
      English sentence.
    form: polite
  i-did-not-eat-fish:
    tokens:
      - { role: object, text: 魚, reading: さかな, wordClass: noun phrase }
      - { role: particle, text: を, reading: を, wordClass: particle }
      - { role: predicate, text: 食べなかった, reading: たべなかった, wordClass: predicate }
    meaning: I did not eat fish.
    reading: さかなをたべなかった。
    translationTokens:
      - { role: implicit, text: 'I ', implicit: true }
      - { role: predicate, text: 'did not eat ' }
      - { role: object, text: fish. }
    text: 魚を食べなかった。
    hint: Check the particles and sentence ending.
    explanation: 魚を食べなかった。 means “I did not eat fish.” Match the vocabulary, particles, and tense to the English sentence.
    form: casual
  last-week-was-not-hot:
    tokens:
      - { role: topic, text: 先週, reading: せんしゅう, wordClass: noun phrase }
      - { role: particle, text: は, reading: は, wordClass: particle }
      - {
          role: predicate,
          text: 暑くなかったです,
          reading: あつくなかったです,
          wordClass: predicate,
        }
    meaning: Last week was not hot.
    reading: せんしゅうはあつくなかったです。
    translationTokens:
      - { role: topic, text: Last week }
      - { role: predicate, text: ' was not hot.' }
    text: 先週は暑くなかったです。
    hint: Check the particles and sentence ending.
    explanation:
      先週は暑くなかったです。 means “Last week was not hot.” Match the vocabulary, particles, and tense to the
      English sentence.
    form: polite
