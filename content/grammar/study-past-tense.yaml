entry:
  id: study-past-tense
  kind: grammar
  note:
    'Learn the past forms together: polite, casual, negative polite, negative casual, and questions. Nouns
    and な-adjectives use でした / だった. い-adjectives change final い to かった; negative past is くなかった. Verbs use ました
    in polite speech and their た-form in casual speech: 食べた (たべた), 読んだ (よんだ). Learn each verb’s conjugation;
    do not simply remove ました to make the casual form. Negative verbs use ませんでした / なかった. Add か for a polite
    question; casual questions can use rising intonation: 食べた？ (たべた？). いい becomes よかった / よくなかった. Negative
    questions can seek confirmation rather than being neutral yes-or-no questions.'
  tags:
    - Study guide
    - Adjective guide
  level: N5
  title: Past
  topic: Tenses
  meaning: Past
  reading: きのうはやすみでした。
  examples:
    - tokens:
        - { role: modifier, text: 昨日, reading: きのう, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 休みでした, reading: やすみでした, wordClass: predicate }
      meaning: Yesterday was a day off.
      reading: きのうはやすみでした。
      japanese: 昨日は休みでした。
      translationTokens:
        - { role: modifier, text: Yesterday }
        - { role: predicate, text: ' was a day off.' }
    - tokens:
        - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 食べなかった, reading: たべなかった, wordClass: predicate }
      meaning: I did not eat bread.
      reading: ぱんをたべなかった。
      japanese: パンを食べなかった。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: 'did not eat ' }
        - { role: object, text: bread. }
    - tokens:
        - { role: topic, text: 昨日, reading: きのう, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - {
            role: predicate,
            text: 暑くなかったです,
            reading: あつくなかったです,
            wordClass: predicate,
          }
      meaning: Yesterday was not hot.
      reading: きのうはあつくなかったです。
      japanese: 昨日は暑くなかったです。
      translationTokens:
        - { role: topic, text: Yesterday }
        - { role: predicate, text: ' was not hot.' }
    - tokens:
        - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 元気でした, reading: げんきでした, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: Was Tanaka well?
      reading: たなかさんはげんきでしたか。
      japanese: 田中さんは元気でしたか。
      translationTokens:
        - { role: predicate, text: 'Was ' }
        - { role: topic, text: Tanaka }
        - { role: predicate, text: ' well' }
        - { role: particle, text: '?' }
  japanese: 昨日は休みでした。
