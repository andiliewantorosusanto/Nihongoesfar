entry:
  id: study-ni-vs-e
  kind: grammar
  title: 'Going places: に versus へ'
  japanese: 学校に行きます。
  reading: がっこうにいきます。
  meaning: Destination に and direction へ
  level: N5
  topic: Travel
  tags:
    - Study guide
    - Particles
  note:
    'With 行く (いく), 来る (くる), and 帰る (かえる), に emphasizes the destination and へ emphasizes movement toward it.
    They are often interchangeable in ordinary travel sentences. The particle へ is pronounced え (e). に has
    other uses that へ cannot replace: time, existence, and a verb’s target, such as 七時に起きます (しちじにおきます), 部屋にいます
    (へやにいます), and 電車に乗ります (でんしゃにのります). Use で for the vehicle or means of travel: 車で学校に行きます (くるまでがっこうにいきます).'
  examples:
    - japanese: 学校に行きます。
      reading: がっこうにいきます。
      meaning: I go to school.
      tokens:
        - {
            text: 学校に行きます,
            reading: がっこうにいきます,
            role: predicate,
            wordClass: sentence,
          }
      translationTokens:
        - { text: I go to school., role: predicate }
    - japanese: 学校へ行きます。
      reading: がっこうへいきます。
      meaning: I go toward school / to school.
      tokens:
        - {
            text: 学校へ行きます,
            reading: がっこうへいきます,
            role: predicate,
            wordClass: sentence,
          }
      translationTokens:
        - { text: I go toward school / to school., role: predicate }
    - japanese: 車で会社に行きます。
      reading: くるまでかいしゃにいきます。
      meaning: I go to work by car.
      tokens:
        - {
            text: 車で会社に行きます,
            reading: くるまでかいしゃにいきます,
            role: predicate,
            wordClass: sentence,
          }
      translationTokens:
        - { text: I go to work by car., role: predicate }
    - japanese: 家へ帰ります。
      reading: いえへかえります。
      meaning: I return home.
      tokens:
        - { text: 家へ帰ります, reading: いえへかえります, role: predicate, wordClass: sentence }
      translationTokens:
        - { text: I return home., role: predicate }
