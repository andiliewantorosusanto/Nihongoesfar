exercises:
  - id: meaning
    type: meaning-choice
    sentence: what-is-your-job
    choices:
      - text: What is your job?
        reading: ''
      - text: I am a company employee.
        reading: ''
      - text: I am a student.
        reading: ''
      - text: I am a teacher.
        reading: ''
    answers:
      - What is your job?
  - id: pattern
    type: pattern-choice
    sentence: i-am-a-company-employee
    choices:
      - sentence: what-is-your-job
      - sentence: i-am-a-company-employee
    prompt: 'Choose the Japanese: I am a company employee.'
    answers:
      - 会社員です
      - かいしゃいんです
  - id: gap
    type: gap
    sentence: i-am-a-company-employee
    prompt: 'Fill the missing part: I am a company employee. (polite)'
    answers:
      - 会社員です
      - かいしゃいんです
    context:
      text: ___。
      tokens:
        - { role: predicate, text: ___, reading: ___, wordClass: predicate }
      reading: ___。
  - id: tiles
    type: tiles
    sentence: i-am-a-company-employee
    prompt: 'Build: I am a company employee. (polite)'
    answers:
      - 会社員です
      - かいしゃいんです
    tiles:
      - { role: predicate, text: 会社員です, reading: かいしゃいんです, wordClass: predicate }
  - id: typing
    type: typing
    sentence: i-am-a-student
    answers:
      - 学生です
      - がくせいです
  - id: alternate
    type: typing
    sentence: i-am-a-teacher
    alternate: true
    prompt: 'Another example: I am a teacher. (polite)'
    answers:
      - 教師です
      - きょうしです
  - id: expanded-1-meaning
    type: meaning-choice
    sentence: i-am-a-teacher-2
    choices:
      - text: I am a teacher.
        reading: ''
      - text: What is your job?
        reading: ''
      - text: I am a company employee.
        reading: ''
      - text: I am a student.
        reading: ''
    answers:
      - I am a teacher.
  - id: expanded-1-typing
    type: typing
    sentence: i-am-a-teacher-2
    explanation: 先生です。 means “I am a teacher.” Write the complete sentence, including the indicated ending.
    answers:
      - 先生です
      - せんせいです
  - id: expanded-1-tiles
    type: tiles
    sentence: i-am-a-teacher-2
    prompt: 'Build this sentence: I am a teacher. (polite)'
    explanation: 先生です。 means “I am a teacher.” Keep the particles with their phrases and put the predicate last.
    answers:
      - 先生です
      - せんせいです
  - id: expanded-1-pattern
    type: pattern-choice
    sentence: i-am-a-teacher-2
    choices:
      - sentence: i-am-a-teacher-2
      - text: お仕事は何ですか。
        reading: おしごとはなんですか。
        tokens:
          - { role: topic, text: お仕事, reading: おしごと, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 何です, reading: なんです, wordClass: predicate }
          - { role: particle, text: か, reading: か, wordClass: particle }
      - text: 会社員です。
        reading: かいしゃいんです。
        tokens:
          - { role: predicate, text: 会社員です, reading: かいしゃいんです, wordClass: predicate }
      - text: 学生です。
        reading: がくせいです。
        tokens:
          - { role: predicate, text: 学生です, reading: がくせいです, wordClass: predicate }
    prompt: 'Choose the Japanese: I am a teacher. (polite)'
    hint: Match both the meaning and the sentence ending.
    explanation: Choose 先生です。 for “I am a teacher.” The other sentences describe different situations.
    answers:
      - 先生です
      - せんせいです
  - id: expanded-1-gap
    type: gap
    sentence: i-am-a-teacher-2
    prompt: 'Fill the missing part: I am a teacher. (polite)'
    hint: Supply the missing predicate in the indicated form.
    explanation: The missing part is 先生です (せんせいです). Together, the sentence means “I am a teacher.”
    answers:
      - 先生です
      - せんせいです
    context:
      meaning: I am a teacher.
      reading: ___。
      text: ___。
