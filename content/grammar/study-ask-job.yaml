entry:
  id: study-ask-job
  kind: grammar
  note:
    Ask お仕事は何ですか (おしごとはなんですか). Answer with your occupation + です. A student can answer 学生です. These are
    example answers, not information about the visitor.
  tags:
    - Study guide
  level: N5
  title: 'Ask and answer: your job'
  topic: Grammar basics
  romaji: oshigoto wa nan desu ka
  meaning: 'Ask and answer: your job'
  reading: おしごとはなんですか。
  examples:
    - tokens:
        - { role: topic, text: お仕事, reading: おしごと, wordClass: noun phrase }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 何です, reading: なんです, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: What is your job?
      reading: おしごとはなんですか。
      japanese: お仕事は何ですか。
      translationTokens:
        - { role: predicate, text: 'What is ' }
        - { role: topic, text: your job }
        - { role: particle, text: '?' }
    - tokens:
        - { role: predicate, text: 会社員です, reading: かいしゃいんです, wordClass: predicate }
      meaning: I am a company employee.
      reading: かいしゃいんです。
      japanese: 会社員です。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: am a company employee. }
    - tokens:
        - { role: predicate, text: 学生です, reading: がくせいです, wordClass: predicate }
      meaning: I am a student.
      reading: がくせいです。
      japanese: 学生です。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: am a student. }
    - tokens:
        - { role: predicate, text: 教師です, reading: きょうしです, wordClass: predicate }
      meaning: I am a teacher.
      reading: きょうしです。
      japanese: 教師です。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: am a teacher. }
  japanese: お仕事は何ですか。
  references:
    - rows:
        - - text: 会社員
            reading: かいしゃいん
          - text: company employee
            reading: ''
        - - text: 学生
            reading: がくせい
          - text: student
            reading: ''
        - - text: 教師
            reading: きょうし
          - text: teacher (occupation)
            reading: ''
        - - text: 医者
            reading: いしゃ
          - text: doctor
            reading: ''
      columns:
        - Japanese
        - Meaning
      heading: Useful answers
