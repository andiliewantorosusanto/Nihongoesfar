# Grammar source. Run npm run content:build after editing.
entry:
  id: study-particle-fill
  kind: grammar
  title: Particle fill-in practice
  japanese: 助詞の練習
  reading: じょしのれんしゅう
  meaning: Fill multiple particle blanks in complete sentences.
  level: N5
  topic: Particles
  tags:
    - Grammar
    - particles
    - fill-in
  note:
    Fill each numbered blank with a particle. Follow the English meaning. Compare the completed sentence and
    the explanation after checking. Topic は and subject が can change the focus; these drills follow the focus
    of the model sentence.
  examples:
    - tokens:
        - { role: topic, text: 私, reading: わたし, wordClass: pronoun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学生です, reading: がくせいです, wordClass: noun + copula }
      meaning: I am a student.
      reading: わたしはがくせいです。
      japanese: 私は学生です。
      translationTokens:
        - { role: topic, text: I, implicit: false }
        - { role: predicate, text: ' am a student.', implicit: false }
    - tokens:
        - {
            role: modifier,
            text: 図書館で,
            reading: としょかんで,
            wordClass: place noun + particle,
          }
        - { role: predicate, text: 勉強します, reading: べんきょうします, wordClass: verb }
      meaning: I study at the library.
      reading: としょかんでべんきょうします。
      japanese: 図書館で勉強します。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: study, implicit: false }
        - { role: modifier, text: ' at the library.', implicit: false }
    - tokens:
        - {
            role: modifier,
            text: 学校に,
            reading: がっこうに,
            wordClass: destination noun + particle,
          }
        - { role: predicate, text: 行きます, reading: いきます, wordClass: verb }
      meaning: I go to school.
      reading: がっこうにいきます。
      japanese: 学校に行きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: go, implicit: false }
        - { role: modifier, text: ' to school.', implicit: false }
