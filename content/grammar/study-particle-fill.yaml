      - { text: を, reading: を, role: particle, wordClass: particle }
      - { text: 食べます。, reading: たべます。, role: modifier, wordClass: phrase }
    hint:
      Use は for the stated topic and が for the subject. Follow the English meaning for also, possession,
      starting points, and endpoints.
    explanation:
      'Blank 1: は marks the topic (pronounced wa). Blank 2: で marks the location of an action or means
