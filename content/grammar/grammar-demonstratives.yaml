# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-demonstratives
  kind: grammar
  note:
    'これ stands alone: これは本です. この must come before a noun: この本. それ / その refer to something near the listener
    or already mentioned; あれ / あの are distant from both speakers.'
  tags:
    - Grammar
    - demonstratives
  level: N5
  title: これ・それ・あれ and この
  topic: Sentence building
  lesson:
    goal: Point to things using stand-alone and noun-modifying words.
    group: Sentence basics
    order: 5
    recap: これ stands alone; この must be followed by a noun. The same distinction applies to それ/その and あれ/あの.
    examples:
      - tokens:
          - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
        meaning: This is a book.
        reading: これはほんです。
        japanese: これは本です。
        translationTokens:
          - { role: topic, text: This }
          - { role: predicate, text: ' is a book.' }
      - tokens:
          - { role: modifier, text: この, reading: この, wordClass: modifier }
          - { role: topic, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 私, reading: わたし, wordClass: predicate }
          - { role: particle, text: の, reading: の, wordClass: particle }
          - { role: predicate, text: です, reading: です, wordClass: predicate }
        meaning: This book is mine.
        reading: このほんはわたしのです。
        japanese: この本は私のです。
        translationTokens:
          - { role: modifier, text: 'This ' }
          - { role: topic, text: book }
          - { role: predicate, text: ' is mine.' }
      - tokens:
          - { role: modifier, text: その, reading: その, wordClass: modifier }
          - { role: topic, text: 時計, reading: とけい, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 先生, reading: せんせい, wordClass: predicate }
          - { role: particle, text: の, reading: の, wordClass: particle }
          - { role: predicate, text: です, reading: です, wordClass: predicate }
        meaning: That clock is the teacher's.
        reading: そのとけいはせんせいのです。
        japanese: その時計は先生のです。
        translationTokens:
          - { role: modifier, text: 'That ' }
          - { role: topic, text: clock }
          - { role: predicate, text: " is the teacher's." }
    comparison: これ stands alone; この must be followed by a noun. The same distinction applies to それ/その and あれ/あの.
    vocabulary:
      - text: 本
        meaning: book
        reading: ほん
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 時計
        meaning: clock / watch
        reading: とけい
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 車
        meaning: car
        reading: くるま
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
    prerequisites:
      - grammar-desu
      - grammar-no
  meaning: This book is interesting.
  reading: このほんはおもしろいです。
  examples:
    - tokens:
        - { role: modifier, text: この, reading: この, wordClass: demonstrative determiner }
        - { role: topic, text: 本, reading: ほん, wordClass: noun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - {
            role: predicate,
            text: 面白いです,
            reading: おもしろいです,
            wordClass: i-adjective + polite ending,
          }
      meaning: This book is interesting.
      reading: このほんはおもしろいです。
      japanese: この本は面白いです。
      translationTokens:
        - { role: modifier, text: This, implicit: false }
        - { role: topic, text: ' book', implicit: false }
        - { role: predicate, text: ' is interesting.', implicit: false }
  exercise:
    tiles:
      - この
      - 本
      - は
      - 面白い
      - です
    prompt: 'Build: “This book is interesting.” Start with この本.'
    answers:
      - この本は面白いです
      - この本はおもしろいです
      - このほんはおもしろいです
    explanation:
      'これ stands alone: これは本です. この must come before a noun: この本. それ / その refer to something near the
      listener or already mentioned; あれ / あの are distant from both speakers.'
  japanese: この本は面白いです。
