entry:
  id: study-ask-time
  kind: grammar
  note:
    Ask 今、何時ですか (いま、なんじですか). Answer with hour + 時（じ）, then minutes + 分（ふん / ぷん）if needed. 半（はん）means half
    past. This asks clock time; 何時間 asks a duration.
  tags:
    - Study guide
  level: N5
  title: 'Ask and answer: what time is it?'
  topic: Grammar basics
  romaji: ima nanji desu ka
  meaning: 'Ask and answer: what time is it?'
  reading: いまなんじですか。
  examples:
    - tokens:
        - { role: modifier, text: 今, reading: いま, wordClass: noun phrase }
        - { role: predicate, text: 何時です, reading: なんじです, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: What time is it now?
      reading: いまなんじですか。
      japanese: 今何時ですか。
      translationTokens:
        - { role: predicate, text: What time is it }
        - { role: modifier, text: ' now' }
        - { role: particle, text: '?' }
    - tokens:
        - { role: predicate, text: 三時です, reading: さんじです, wordClass: predicate }
      meaning: It is three o’clock.
      reading: さんじです。
      japanese: 三時です。
      translationTokens:
        - { role: predicate, text: It is three o’clock. }
    - tokens:
        - { role: predicate, text: 四時半です, reading: よじはんです, wordClass: predicate }
      meaning: It is half past four.
      reading: よじはんです。
      japanese: 四時半です。
      translationTokens:
        - { role: predicate, text: It is half past four. }
    - tokens:
        - {
            role: predicate,
            text: 七時十五分です,
            reading: しちじじゅうごふんです,
            wordClass: predicate,
          }
      meaning: It is seven fifteen.
      reading: しちじじゅうごふんです。
      japanese: 七時十五分です。
      translationTokens:
        - { role: predicate, text: It is seven fifteen. }
  japanese: 今何時ですか。
  references:
    - rows:
        - - text: 何時ですか
            reading: なんじですか
          - text: What time is it?
            reading: ''
        - - text: 何時間ですか
            reading: なんじかんですか
          - text: How many hours?
            reading: ''
      columns:
        - Japanese
        - Meaning
      heading: Time questions
