# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-te-sequence
  kind: grammar
  title: 'Connecting actions: て-form'
  japanese: パンを食べて学校に行きます。
  reading: ぱんをたべてがっこうにいきます。
  meaning: I eat bread and then go to school.
  level: N5
  topic: Connecting descriptions and actions
  tags:
    - Grammar
    - te-sequence
  note:
    'Use verb て-form + the next verb. Some て-forms end in で: よむ → よんで. Do not simply attach で to every verb.
    The final verb sets tense and politeness.'
  examples:
    - japanese: パンを食べて学校に行きます。
      reading: ぱんをたべてがっこうにいきます。
      meaning: I eat bread and then go to school.
      tokens:
        - { text: パン, reading: ぱん, role: object, wordClass: noun phrase }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 食べて, reading: たべて, role: predicate, wordClass: predicate }
        - { text: 学校, reading: がっこう, role: modifier, wordClass: modifier }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - { text: 行きます, reading: いきます, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: 'eat ', role: predicate }
        - { text: bread, role: object }
        - { text: ' and then go', role: predicate }
        - { text: ' to school.', role: modifier }
    - japanese: 本を読んで寝ます。
      reading: ほんをよんでねます。
      meaning: I read a book and then go to bed.
      tokens:
        - { text: 本, reading: ほん, role: object, wordClass: noun phrase }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 読んで寝ます, reading: よんでねます, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: 'read ', role: predicate }
        - { text: a book, role: object }
        - { text: ' and then go to bed.', role: predicate }
    - japanese: 家に帰って勉強します。
      reading: いえにかえってべんきょうします。
      meaning: I return home and then study.
      tokens:
        - { text: 家, reading: いえ, role: modifier, wordClass: modifier }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - {
            text: 帰って勉強します,
            reading: かえってべんきょうします,
            role: predicate,
            wordClass: predicate,
          }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: 'return ', role: predicate }
        - { text: home, role: modifier }
        - { text: ' and then study.', role: predicate }
  lesson:
    order: 28
    group: Connecting descriptions and actions
    goal: Connect two actions in sequence.
    prerequisites:
      - grammar-te-request
    recap:
      'Use verb て-form + the next verb. Some て-forms end in で: よむ → よんで. Do not simply attach で to every
      verb. The final verb sets tense and politeness.'
    comparison:
      'Use verb て-form + the next verb. Some て-forms end in で: よむ → よんで. Do not simply attach で to every
      verb. The final verb sets tense and politeness.'
    examples:
      - japanese: パンを食べて学校に行きます。
        reading: ぱんをたべてがっこうにいきます。
        meaning: I eat bread and then go to school.
