          - { text: 食べて, reading: たべて, role: predicate, wordClass: predicate }
          - { text: 学校, reading: がっこう, role: modifier, wordClass: modifier }
          - { text: に, reading: に, role: particle, wordClass: particle }
          - { text: 行きます, reading: いきます, role: predicate, wordClass: predicate }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: 'eat ', role: predicate }
          - { text: bread, role: object }
          - { text: ' and then go', role: predicate }
          - { text: ' to school.', role: modifier }
      - japanese: 本を読んで寝ます。
        reading: ほんをよんでねます。
        meaning: I read a book and then go to bed.
        tokens:
          - { text: 本, reading: ほん, role: object, wordClass: noun phrase }
          - { text: を, reading: を, role: particle, wordClass: particle }
          - { text: 読んで寝ます, reading: よんでねます, role: predicate, wordClass: predicate }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: 'read ', role: predicate }
          - { text: a book, role: object }
          - { text: ' and then go to bed.', role: predicate }
      - japanese: 家に帰って勉強します。
        reading: いえにかえってべんきょうします。
        meaning: I return home and then study.
        tokens:
