# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-desu
  kind: grammar
  note:
    は marks the topic (pronounced wa). A noun followed by です makes a polite statement. Japanese often leaves
    out an understood topic; は does not automatically mean the grammatical subject.
  tags:
    - Grammar
    - desu
  level: N5
  title: A は B です
  topic: Sentence building
  lesson:
    goal: Introduce someone or identify something politely.
    group: Sentence basics
    order: 1
    recap: Use noun + です. A noun does not take the verb ending ます.
    examples:
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 学生です, reading: がくせいです, wordClass: predicate }
        meaning: I am a student.
        reading: わたしはがくせいです。
        japanese: 私は学生です。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' am a student.' }
      - tokens:
          - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 先生です, reading: せんせいです, wordClass: predicate }
        meaning: Tanaka is a teacher.
        reading: たなかさんはせんせいです。
        japanese: 田中さんは先生です。
        translationTokens:
          - { role: topic, text: Tanaka }
          - { role: predicate, text: ' is a teacher.' }
      - tokens:
          - { role: topic, text: これ, reading: これ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 本です, reading: ほんです, wordClass: predicate }
        meaning: This is a book.
        reading: これはほんです。
        japanese: これは本です。
        translationTokens:
          - { role: topic, text: This }
          - { role: predicate, text: ' is a book.' }
    comparison: Use noun + です. A noun does not take the verb ending ます.
    vocabulary:
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 学生
        meaning: student
        reading: がくせい
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: 先生
        meaning: teacher
        reading: せんせい
      - text: 本
        meaning: book
        reading: ほん
      - text: 時計
        meaning: clock / watch
        reading: とけい
    prerequisites: []
  meaning: I am a student.
  reading: わたしはがくせいです。
  examples:
    - tokens:
        - { role: topic, text: 私, reading: わたし, wordClass: pronoun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - { role: predicate, text: 学生です, reading: がくせいです, wordClass: noun + copula }
      meaning: I am a student.
      reading: わたしはがくせいです。
      japanese: 私は学生です。
      translationTokens:
        - { role: topic, text: I, implicit: false }
        - { role: predicate, text: ' am a student.', implicit: false }
  exercise:
    tiles:
      - 私
      - は
      - 学生
      - です
    prompt: 'Build: “I am a student.” Start with 私.'
    answers:
      - 私は学生です
      - わたしはがくせいです
    explanation:
      は marks the topic (pronounced wa). A noun followed by です makes a polite statement. Japanese often
      leaves out an understood topic; は does not automatically mean the grammatical subject.
  japanese: 私は学生です。
