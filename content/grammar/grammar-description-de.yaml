entry:
  id: grammar-description-de
  kind: grammar
  title: 'Connecting な-adjectives and nouns: 〜で'
  japanese: この町は静かで便利です。
  reading: このまちはしずかでべんりです。
  meaning: This town is quiet and convenient.
  level: N5
  topic: Connecting descriptions and actions
  tags:
    - Grammar
    - description-de
  note:
    Use the な-adjective stem + で, or noun + で, before the next description. きれい uses で despite ending in い.
    This connecting で differs from the place or means particle で.
  examples:
    - japanese: この町は静かで便利です。
      reading: このまちはしずかでべんりです。
      meaning: This town is quiet and convenient.
      tokens:
        - { text: この, reading: この, role: modifier, wordClass: modifier }
        - { text: 町, reading: まち, role: topic, wordClass: noun phrase }
        - { text: は, reading: は, role: particle, wordClass: particle }
        - { text: 静か, reading: しずか, role: predicate, wordClass: predicate }
        - { text: で, reading: で, role: particle, wordClass: particle }
        - { text: 便利です, reading: べんりです, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'This ', role: modifier }
        - { text: town, role: topic }
        - { text: ' is quiet and convenient.', role: predicate }
    - japanese: この部屋はきれいで静かです。
      reading: このへやはきれいでしずかです。
      meaning: This room is clean and quiet.
      tokens:
        - { text: この, reading: この, role: modifier, wordClass: modifier }
        - { text: 部屋, reading: へや, role: topic, wordClass: noun phrase }
        - { text: は, reading: は, role: particle, wordClass: particle }
        - { text: きれい, reading: きれい, role: predicate, wordClass: predicate }
        - { text: で, reading: で, role: particle, wordClass: particle }
        - { text: 静かです, reading: しずかです, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'This ', role: modifier }
        - { text: room, role: topic }
        - { text: ' is clean and quiet.', role: predicate }
    - japanese: 田中さんは先生で親切です。
      reading: たなかさんはせんせいでしんせつです。
      meaning: Tanaka is a teacher and kind.
      tokens:
        - { text: 田中さん, reading: たなかさん, role: topic, wordClass: noun phrase }
        - { text: は, reading: は, role: particle, wordClass: particle }
        - { text: 先生, reading: せんせい, role: predicate, wordClass: predicate }
        - { text: で, reading: で, role: particle, wordClass: particle }
        - { text: 親切です, reading: しんせつです, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: Tanaka, role: topic }
        - { text: ' is a teacher and kind.', role: predicate }
  lesson:
    order: 27
    group: Connecting descriptions and actions
    goal: Join descriptions using a な-adjective or noun.
    prerequisites:
      - grammar-na-adjective
      - grammar-adjective-kute
    recap:
      Use the な-adjective stem + で, or noun + で, before the next description. きれい uses で despite ending in い.
      This connecting で differs from the place or means particle で.
    comparison:
      Use the な-adjective stem + で, or noun + で, before the next description. きれい uses で despite ending
