entry:
  id: study-daily-routine
  kind: grammar
  note:
    何時に asks at what time; 何時間 asks how many hours. Use どのくらいかかりますか for travel time. Answer clock times with
    に, but durations without に. Use ます for routines and ました for past activities. Replace these example answers
    with your own.
  tags:
    - Study guide
  level: N5
  title: 'Daily routine: ask and answer'
  topic: Grammar basics
  meaning: 'Daily routine: ask and answer'
  reading: なんじにおきますか。
  examples:
    - tokens:
        - { role: modifier, text: 何時, reading: なんじ, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 起きます, reading: おきます, wordClass: predicate }
        - { role: particle, text: か, reading: か, wordClass: particle }
      meaning: What time do you wake up?
      reading: なんじにおきますか。
      japanese: 何時に起きますか。
      translationTokens:
        - { role: modifier, text: 'What time ' }
        - { role: predicate, text: do you wake up }
        - { role: particle, text: '?' }
    - tokens:
        - { role: modifier, text: 六時, reading: ろくじ, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 起きます, reading: おきます, wordClass: predicate }
      meaning: At six I wake up.
      reading: ろくじにおきます。
      japanese: 六時に起きます。
      translationTokens:
        - { role: modifier, text: 'At six ' }
        - { role: predicate, text: I wake up. }
    - tokens:
        - { role: modifier, text: 十一時, reading: じゅういちじ, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 寝ます, reading: ねます, wordClass: predicate }
      meaning: At eleven I go to bed.
      reading: じゅういちじにねます。
      japanese: 十一時に寝ます。
      translationTokens:
        - { role: modifier, text: 'At eleven ' }
        - { role: predicate, text: I go to bed. }
    - tokens:
        - { role: modifier, text: 八時, reading: はちじ, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 起きます, reading: おきます, wordClass: predicate }
      meaning: At eight I wake up.
      reading: はちじにおきます。
      japanese: 八時に起きます。
      translationTokens:
        - { role: modifier, text: 'At eight ' }
        - { role: predicate, text: I wake up. }
  japanese: 何時に起きますか。
  references:
    - rows:
        - - text: Wake up
            reading: ''
          - text: 何時に起きますか。
            reading: なんじにおきますか。
          - text: 六時に起きます。
            reading: ろくじにおきます。
          - text: What time do you wake up? → I wake up at six.
            reading: ''
        - - text: Go to school
            reading: ''
          - text: 何時に学校に行きますか。
            reading: なんじにがっこうにいきますか。
          - text: 八時に学校に行きます。
            reading: はちじにがっこうにいきます。
          - text: What time do you go to school? → I go at eight.
            reading: ''
        - - text: Go to work
            reading: ''
          - text: 何時に仕事に行きますか。
            reading: なんじにしごとにいきますか。
          - text: 九時に仕事に行きます。
            reading: くじにしごとにいきます。
          - text: What time do you go to work? → I go at nine.
            reading: ''
        - - text: Travel to school
            reading: ''
          - text: 学校までどのくらいかかりますか。
            reading: がっこうまでどのくらいかかりますか。
          - text: 三十分かかります。
            reading: さんじゅっぷんかかります。
          - text: How long does it take to get to school? → It takes thirty minutes.
            reading: ''
        - - text: Travel to work
            reading: ''
          - text: 職場までどのくらいかかりますか。
            reading: しょくばまでどのくらいかかりますか。
          - text: 一時間かかります。
            reading: いちじかんかかります。
          - text: How long does it take to get to work? → It takes an hour.
            reading: ''
        - - text: Time at school
            reading: ''
          - text: 毎日何時間学校にいますか。
            reading: まいにちなんじかんがっこうにいますか。
          - text: 六時間います。
            reading: ろくじかんいます。
          - text: How many hours are you at school each day? → Six hours.
            reading: ''
        - - text: Hours of work
            reading: ''
          - text: 毎日何時間働きますか。
            reading: まいにちなんじかんはたらきますか。
          - text: 八時間働きます。
            reading: はちじかんはたらきます。
          - text: How many hours do you work each day? → Eight hours.
            reading: ''
        - - text: Food
            reading: ''
          - text: 昨日、何を食べましたか。
            reading: きのう、なにをたべましたか。
          - text: カレーを食べました。
            reading: かれーをたべました。
          - text: What did you eat yesterday? → I ate curry.
            reading: ''
        - - text: Cooking
            reading: ''
          - text: 昨日、何を作りましたか。
            reading: きのう、なにをつくりましたか。
          - text: 晩ご飯にカレーを作りました。
            reading: ばんごはんにかれーをつくりました。
          - text: What did you make yesterday? → I made curry for dinner.
            reading: ''
        - - text: Activities
            reading: ''
          - text: 昨日、何をしましたか。
            reading: きのう、なにをしましたか。
          - text: 日本語を勉強しました。
            reading: にほんごをべんきょうしました。
          - text: What did you do yesterday? → I studied Japanese.
            reading: ''
        - - text: Bedtime
            reading: ''
          - text: 何時に寝ますか。
            reading: なんじにねますか。
          - text: 十一時に寝ます。
            reading: じゅういちじにねます。
          - text: What time do you go to bed? → I go to bed at eleven.
            reading: ''
      columns:
        - Topic
        - Ask
        - Example answer
        - Meaning
      heading: Daily routine
