entry:
  id: study-some-any-none
  kind: grammar
  title: Something, someone, somewhere; nothing
  japanese: 何かを食べます。
  reading: なにかをたべます。
  meaning: Say that something or someone exists, go somewhere, or say that there is nothing.
  level: N5
  topic: Movement and expressions
  tags:
    - Study guide
  note:
    'Question word + か: 何 (なに, what), 誰 (だれ, who), and どこ (where) become 何か (something), 誰か
    (someone), and どこか (somewhere). The か is part of the word here; it does not make the sentence a
    question.

    Question word + も + a negative ending: 何も (なにも) with a negative means nothing / not anything,
    and 誰も (だれも) with a negative means nobody / not anybody. Include the negative ending: 何も食べません
    (なにもたべません) means “I do not eat anything.” The も alone does not make a sentence negative.

    Particle order: say 何かを食べます (なにかをたべます), but 何も食べません (なにもたべません), without を. For destinations,
    keep に before も: どこかに行きます (どこかにいきます) becomes どこにも行きません (どこにもいきません).

    All full sentences in the tables below use polite endings. 時々 (ときどき, sometimes) is a separate
    frequency word; it is not formed by adding か to a question word.'
  examples:
    - japanese: 何かを食べます。
      reading: なにかをたべます。
      meaning: I eat something.
      tokens:
        - { text: 何か, reading: なにか, role: object, wordClass: phrase }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 食べます, reading: たべます, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: eat, role: predicate }
        - { text: ' something', role: object }
        - { text: ., role: implicit, implicit: true }
    - japanese: 誰かがいます。
      reading: だれかがいます。
      meaning: Someone is here.
      tokens:
        - { text: 誰か, reading: だれか, role: topic, wordClass: phrase }
        - { text: が, reading: が, role: particle, wordClass: particle }
        - { text: います, reading: います, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: Someone, role: topic }
        - { text: ' is here', role: predicate }
        - { text: ., role: implicit, implicit: true }
    - japanese: どこかに行きます。
      reading: どこかにいきます。
      meaning: I go somewhere.
      tokens:
        - { text: どこか, reading: どこか, role: modifier, wordClass: phrase }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - { text: 行きます, reading: いきます, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: go, role: predicate }
        - { text: ' somewhere', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: 何もありません。
      reading: なにもありません。
      meaning: There is not anything.
      tokens:
        - { text: 何も, reading: なにも, role: object, wordClass: phrase }
        - { text: ありません, reading: ありません, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: There is not, role: predicate }
        - { text: ' anything', role: object }
        - { text: ., role: implicit, implicit: true }
  references:
    - heading: 'With か: something, someone, somewhere'
      columns:
        - Pattern
        - Polite example
        - Meaning
      rows:
        - - text: 何か
            reading: なにか
          - text: 何かを食べます。
            reading: なにかをたべます。
          - text: I eat something.
            reading: ''
        - - text: 誰か
            reading: だれか
          - text: 誰かがいます。
            reading: だれかがいます。
          - text: Someone is here.
            reading: ''
        - - text: どこか
            reading: どこか
          - text: どこかに行きます。
            reading: どこかにいきます。
          - text: I go somewhere.
            reading: ''
    - heading: 'With も and a negative ending: nothing, nobody, nowhere'
      columns:
        - Pattern
        - Polite example
        - Meaning
      rows:
        - - text: 何も + negative
            reading: なにも + negative
          - text: 何も食べません。
            reading: なにもたべません。
          - text: I do not eat anything.
            reading: ''
        - - text: 誰も + negative
            reading: だれも + negative
          - text: 誰もいません。
            reading: だれもいません。
          - text: Nobody is here.
            reading: ''
        - - text: どこにも + negative
            reading: どこにも + negative
          - text: どこにも行きません。
            reading: どこにもいきません。
          - text: I do not go anywhere.
            reading: ''
