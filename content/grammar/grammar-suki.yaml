# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-suki
  kind: grammar
  note:
    '好き is a な-adjective, not a verb. Use noun が好きです to say what you like. Before another noun, use 好きな:
    好きな食べ物 (favorite food). 嫌い (disliked) is also a な-adjective despite ending in い.'
  tags:
    - Grammar
    - suki
  level: N5
  title: 'Likes: 好きです'
  topic: Sentence building
  lesson:
    goal: Say what you like.
    group: Descriptions and preferences
    order: 21
    recap:
      好き is a な-adjective. The liked thing is marked by が in this basic pattern, not the action-object
      particle を.
    examples:
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: subject, text: 猫, reading: ねこ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: 好きです, reading: すきです, wordClass: predicate }
        meaning: I like cats.
        reading: わたしはねこがすきです。
        japanese: 私は猫が好きです。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' like ' }
          - { role: subject, text: cats. }
      - tokens:
          - { role: topic, text: 私, reading: わたし, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: 好きです, reading: すきです, wordClass: predicate }
        meaning: I like books.
        reading: わたしはほんがすきです。
        japanese: 私は本が好きです。
        translationTokens:
          - { role: topic, text: I }
          - { role: predicate, text: ' like ' }
          - { role: subject, text: books. }
      - tokens:
          - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: subject, text: お茶, reading: おちゃ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: 好きです, reading: すきです, wordClass: predicate }
        meaning: Tanaka likes tea.
        reading: たなかさんはおちゃがすきです。
        japanese: 田中さんはお茶が好きです。
        translationTokens:
          - { role: topic, text: Tanaka }
          - { role: predicate, text: ' likes ' }
          - { role: subject, text: tea. }
    comparison:
      好き is a な-adjective. The liked thing is marked by が in this basic pattern, not the action-object
      particle を.
    vocabulary:
      - text: 私
        meaning: I / me
        reading: わたし
      - text: 猫
        meaning: cat
        reading: ねこ
      - text: 好きです
        meaning: like
        reading: すきです
      - text: 本
        meaning: book
        reading: ほん
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: お茶
        meaning: tea
        reading: おちゃ
      - text: 犬
        meaning: dog
        reading: いぬ
    prerequisites:
      - grammar-na-adjective
  meaning: I like cats.
  reading: ねこがすきです。
  examples:
    - tokens:
        - { role: subject, text: 猫, reading: ねこ, wordClass: noun }
        - { role: particle, text: が, reading: が, wordClass: subject particle }
        - { role: predicate, text: 好きです, reading: すきです, wordClass: na-adjective + copula }
      meaning: I like cats.
      reading: ねこがすきです。
      japanese: 猫が好きです。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: like, implicit: false }
        - { role: subject, text: ' cats.', implicit: false }
  exercise:
    tiles:
      - 猫
      - が
      - 好き
      - です
    prompt: 'Build: “I like cats.” Leave out 私.'
    answers:
      - 猫が好きです
      - ねこがすきです
      - 猫がすきです
    explanation:
      '好き is a な-adjective, not a verb. Use noun が好きです to say what you like. Before another noun, use
      好きな: 好きな食べ物 (favorite food). 嫌い (disliked) is also a な-adjective despite ending in い.'
  japanese: 猫が好きです。
