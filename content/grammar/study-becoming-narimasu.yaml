entry:
  id: study-becoming-narimasu
  kind: grammar
  title: 'Becoming: い-adjective → く / な-adjective or noun → に + なります'
  japanese: 寒くなります。
  reading: さむくなります。
  meaning: 'Becoming: い-adjective → く / な-adjective or noun → に + なります'
  level: N5
  topic: Movement and expressions
  tags:
    - Study guide
  note:
    'なります means become; it is the polite form of なる. For an い-adjective, replace final い with く: 寒い→寒くなります
    (さむい→さむくなります). いい is irregular: よくなります. For a な-adjective or noun, use に: 静かになります (しずかになります), 先生になります
    (せんせいになります). Do not use な before なります. きれい is a な-adjective despite its final い: きれいになります. These are
    adjective and noun patterns, not a rule for all nouns ending in い. Compare a change of state なります with a
    deliberate change します: 部屋をきれいにします (へやをきれいにします) means I make the room clean.'
  examples:
    - japanese: 寒くなります。
      reading: さむくなります。
      meaning: It becomes cold.
      tokens:
        - { text: 寒く, reading: さむく, role: modifier, wordClass: phrase }
        - { text: なります, reading: なります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'It ', role: implicit, implicit: true }
        - { text: becomes, role: predicate }
        - { text: ' cold', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: 静かになります。
      reading: しずかになります。
      meaning: It becomes quiet.
      tokens:
        - { text: 静かに, reading: しずかに, role: modifier, wordClass: phrase }
        - { text: なります, reading: なります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'It ', role: implicit, implicit: true }
        - { text: becomes, role: predicate }
        - { text: ' quiet', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: 先生になります。
      reading: せんせいになります。
      meaning: I become a teacher.
      tokens:
        - { text: 先生に, reading: せんせいに, role: modifier, wordClass: phrase }
        - { text: なります, reading: なります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: become, role: predicate }
        - { text: ' a teacher', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: よくなります。
      reading: よくなります。
      meaning: It gets better.
      tokens:
        - { text: よく, reading: よく, role: modifier, wordClass: phrase }
        - { text: なります, reading: なります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'It ', role: implicit, implicit: true }
        - { text: gets, role: predicate }
        - { text: ' better', role: modifier }
        - { text: ., role: implicit, implicit: true }
