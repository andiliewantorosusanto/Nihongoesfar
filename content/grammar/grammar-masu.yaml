# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-masu
  kind: grammar
  note:
    ます is a polite verb ending. It describes habits or future actions depending on context. It does not by
    itself mean an action is happening right now. Learn each verb’s ます form alongside its dictionary form.
  tags:
    - Grammar
    - masu
  level: N5
  title: 'Polite non-past: ます'
  topic: Sentence building
  lesson:
    goal: Describe a routine with a polite verb.
    group: Polite verbs and particles
    order: 6
    recap: Use ます with a verb stem. Noun + です and verb + ます are different patterns.
    examples:
      - tokens:
          - { role: modifier, text: 毎日, reading: まいにち, wordClass: modifier }
          - { role: predicate, text: 勉強します, reading: べんきょうします, wordClass: predicate }
        meaning: I study every day.
        reading: まいにちべんきょうします。
        japanese: 毎日勉強します。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: study }
          - { role: modifier, text: ' every day.' }
      - tokens:
          - { role: modifier, text: 朝, reading: あさ, wordClass: modifier }
          - { role: predicate, text: 働きます, reading: はたらきます, wordClass: predicate }
        meaning: I work in the morning.
        reading: あさはたらきます。
        japanese: 朝働きます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: work }
          - { role: modifier, text: ' in the morning.' }
      - tokens:
          - { role: modifier, text: 毎日, reading: まいにち, wordClass: modifier }
          - { role: predicate, text: 歩きます, reading: あるきます, wordClass: predicate }
        meaning: I walk every day.
        reading: まいにちあるきます。
        japanese: 毎日歩きます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: walk }
          - { role: modifier, text: ' every day.' }
    comparison: Use ます with a verb stem. Noun + です and verb + ます are different patterns.
    vocabulary:
      - text: 毎日
        meaning: every day
        reading: まいにち
      - text: 勉強し
        meaning: study (verb stem)
        reading: べんきょうし
      - text: 朝
        meaning: morning
        reading: あさ
      - text: 働き
        meaning: work (verb stem)
        reading: はたらき
      - text: 歩き
        meaning: walk (verb stem)
        reading: あるき
      - text: 夜
        meaning: night
        reading: よる
    prerequisites:
      - grammar-desu
  meaning: I read a book every day.
  reading: まいにちほんをよみます。
  examples:
    - tokens:
        - { role: modifier, text: 毎日, reading: まいにち, wordClass: time noun }
        - { role: object, text: 本, reading: ほん, wordClass: noun }
        - { role: particle, text: を, reading: を, wordClass: object particle }
        - { role: predicate, text: 読みます, reading: よみます, wordClass: verb }
      meaning: I read a book every day.
      reading: まいにちほんをよみます。
      japanese: 毎日本を読みます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: read, implicit: false }
        - { role: object, text: ' a book', implicit: false }
        - { role: modifier, text: ' every day.', implicit: false }
  exercise:
    tiles:
      - 毎日
      - 本
      - を
      - 読みます
    prompt: 'Build: “I read a book every day.” Start with 毎日.'
    answers:
      - 毎日本を読みます
      - まいにちほんをよみます
    explanation:
      ます is a polite verb ending. It describes habits or future actions depending on context. It does
      not by itself mean an action is happening right now. Learn each verb’s ます form alongside its dictionary
      form.
  japanese: 毎日本を読みます。
