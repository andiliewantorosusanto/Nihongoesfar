# Grammar source. Run npm run content:build after editing.
entry:
  id: study-verb-particle-pairs
  kind: grammar
  note:
    'Learn the particle together with the verb. を is pronounced “o”. It marks an object, but also a place or
    vehicle you leave, or a route you move through. に can mark what you board, a place you enter, or a person
    you meet. These patterns stay the same in polite and casual speech. For example, use 電車に乗ります (でんしゃにのります),
    not 電車を乗ります. The place where you board or get off takes で: 駅で電車を降ります (えきででんしゃをおります).'
  tags:
    - Study guide
  level: N5
  title: 'Verb–particle pairs: を and に'
  topic: Polite verbs and particles
  meaning: 'Verb–particle pairs: を and に'
  reading: でんしゃにのります。
  examples:
    - tokens:
        - { role: modifier, text: 電車, reading: でんしゃ, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 乗ります, reading: のります, wordClass: predicate }
      meaning: I get on the train.
      reading: でんしゃにのります。
      japanese: 電車に乗ります。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: get on }
        - { role: modifier, text: ' the train.' }
    - tokens:
        - { role: modifier, text: バス, reading: ばす, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 降ります, reading: おります, wordClass: predicate }
      meaning: I get off the bus.
      reading: ばすをおります。
      japanese: バスを降ります。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: get off }
        - { role: modifier, text: ' the bus.' }
    - tokens:
        - { role: modifier, text: 部屋, reading: へや, wordClass: noun phrase }
        - { role: particle, text: に, reading: に, wordClass: particle }
        - { role: predicate, text: 入ります, reading: はいります, wordClass: predicate }
      meaning: I enter the room.
      reading: へやにはいります。
      japanese: 部屋に入ります。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: enter }
        - { role: modifier, text: ' the room.' }
    - tokens:
        - { role: modifier, text: 家, reading: いえ, wordClass: noun phrase }
        - { role: particle, text: を, reading: を, wordClass: particle }
        - { role: predicate, text: 出ます, reading: でます, wordClass: predicate }
      meaning: I leave the house.
      reading: いえをでます。
      japanese: 家を出ます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: leave }
        - { role: modifier, text: ' the house.' }
  japanese: 電車に乗ります。
  references:
    - rows:
        - - text: Board a vehicle
            reading: ''
          - text: 電車に乗ります
            reading: でんしゃにのります
          - text: 電車に乗る
            reading: でんしゃにのる
          - text: get on the train
            reading: ''
        - - text: Leave a vehicle
            reading: ''
          - text: バスを降ります
            reading: ばすをおります
          - text: バスを降りる
            reading: ばすをおりる
          - text: get off the bus
            reading: ''
        - - text: Enter a place
            reading: ''
          - text: 部屋に入ります
            reading: へやにはいります
          - text: 部屋に入る
            reading: へやにはいる
          - text: enter the room
            reading: ''
        - - text: Leave a place
            reading: ''
          - text: 家を出ます
            reading: いえをでます
          - text: 家を出る
            reading: いえをでる
          - text: leave the house
            reading: ''
        - - text: Move through a place
            reading: ''
          - text: 公園を散歩します
            reading: こうえんをさんぽします
          - text: 公園を散歩する
            reading: こうえんをさんぽする
          - text: take a walk in the park
            reading: ''
        - - text: Meet a person
            reading: ''
          - text: 友達に会います
            reading: ともだちにあいます
          - text: 友達に会う
            reading: ともだちにあう
          - text: meet a friend
            reading: ''
        - - text: Sit on a seat
            reading: ''
          - text: 椅子に座ります
            reading: いすにすわります
          - text: 椅子に座る
            reading: いすにすわる
          - text: sit on a chair
            reading: ''
        - - text: Act on an object
            reading: ''
          - text: 水を飲みます
            reading: みずをのみます
          - text: 水を飲む
            reading: みずをのむ
          - text: drink water
            reading: ''
      columns:
        - Use
        - Polite
        - Casual
        - Meaning
      heading: Learn each verb with its particle
