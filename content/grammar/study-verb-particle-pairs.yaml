      - { role: particle, text: を, reading: を, wordClass: particle }
      - { role: predicate, text: 降ります, reading: おります, wordClass: predicate }
  - id: typing
    type: typing
    sentence: i-enter-the-room
    answers:
      - 部屋に入ります
      - 部屋にはいります
      - へやに入ります
      - へやにはいります
  - id: alternate
    type: typing
    sentence: i-leave-the-house
    alternate: true
    prompt: 'Another example: I leave the house. (polite)'
    answers:
