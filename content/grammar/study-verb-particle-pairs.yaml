exercises:
  - id: meaning
    type: meaning-choice
    sentence: i-get-on-the-train
    choices:
      - text: I get on the train.
        reading: ''
      - text: I get off the bus.
        reading: ''
      - text: I enter the room.
        reading: ''
      - text: I leave the house.
        reading: ''
    answers:
      - I get on the train.
  - id: pattern
    type: pattern-choice
    sentence: i-get-off-the-bus
    choices:
      - sentence: i-get-off-the-bus
      - text: バスに降ります。
        reading: ばすにおります。
    prompt: 'Choose the Japanese: I get off the bus.'
    explanation:
      'Use を with the vehicle you get off: バスを降ります (ばすをおります). Use に with the vehicle you board: バスに乗ります
      (ばすにのります).'
    answers:
      - バスを降ります
      - バスをおります
      - ばすを降ります
      - ばすをおります
  - id: gap
    type: gap
    sentence: i-get-off-the-bus
    prompt: 'Fill the missing part: I get off the bus. (polite)'
    answers:
      - を
      - を
    context:
      text: バス___降ります。
      tokens:
        - { role: modifier, text: バス, reading: ばす, wordClass: noun phrase }
        - { role: particle, text: ___, reading: ___, wordClass: particle }
        - { role: predicate, text: 降ります, reading: おります, wordClass: predicate }
      reading: ばす___おります。
  - id: tiles
    type: tiles
    sentence: i-get-off-the-bus
    prompt: 'Build: I get off the bus. (polite)'
    answers:
