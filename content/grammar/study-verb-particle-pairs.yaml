    type: tiles
    sentence: i-get-on-the-bus
    prompt: 'Build this sentence: I get on the bus. (polite)'
    explanation: バスに乗ります。 means “I get on the bus.” Keep the particles with their phrases and put the predicate last.
    answers:
      - バスに乗ります
      - ばすにのります
  - id: expanded-1-pattern
