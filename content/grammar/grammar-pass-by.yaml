# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-pass-by
  kind: grammar
  title: 'Passing by or through: 〜を通る'
  japanese: 駅の前を通ります。
  reading: えきのまえをとおります。
  meaning: I pass in front of the station.
  level: N5
  topic: Passing places
  tags:
    - Grammar
    - pass-by
  note:
    'Use place + を + とおる for a route you pass along or through. To pass by a building, use its まえ:
    えきのまえをとおります. を marks the route here, rather than a direct object.'
  examples:
    - japanese: 駅の前を通ります。
      reading: えきのまえをとおります。
      meaning: I pass in front of the station.
      tokens:
        - { text: 駅, reading: えき, role: modifier, wordClass: modifier }
        - { text: の, reading: の, role: particle, wordClass: particle }
        - { text: 前, reading: まえ, role: modifier, wordClass: modifier }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 通ります, reading: とおります, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: pass, role: predicate }
        - { text: ' in front of the station.', role: modifier }
    - japanese: 学校の前を通ります。
      reading: がっこうのまえをとおります。
      meaning: I pass in front of the school.
      tokens:
        - { text: 学校, reading: がっこう, role: modifier, wordClass: modifier }
        - { text: の, reading: の, role: particle, wordClass: particle }
        - { text: 前, reading: まえ, role: modifier, wordClass: modifier }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 通ります, reading: とおります, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: pass, role: predicate }
        - { text: ' in front of the school.', role: modifier }
    - japanese: 公園を通って帰ります。
      reading: こうえんをとおってかえります。
      meaning: I go home through the park.
      tokens:
        - { text: 公園, reading: こうえん, role: modifier, wordClass: modifier }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - {
            text: 通って帰ります,
            reading: とおってかえります,
            role: predicate,
            wordClass: predicate,
          }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: go home, role: predicate }
        - { text: ' through the park.', role: modifier }
  lesson:
    order: 29
    group: Passing places
    goal: Say you pass by or through a place.
    prerequisites:
      - grammar-object
      - grammar-destination
    recap:
      'Use place + を + とおる for a route you pass along or through. To pass by a building, use its まえ:
      えきのまえをとおります. を marks the route here, rather than a direct object.'
    comparison:
      'Use place + を + とおる for a route you pass along or through. To pass by a building, use its まえ:
      えきのまえをとおります. を marks the route here, rather than a direct object.'
    examples:
      - japanese: 駅の前を通ります。
        reading: えきのまえをとおります。
        meaning: I pass in front of the station.
        tokens:
          - { text: 駅, reading: えき, role: modifier, wordClass: modifier }
          - { text: の, reading: の, role: particle, wordClass: particle }
          - { text: 前, reading: まえ, role: modifier, wordClass: modifier }
          - { text: を, reading: を, role: particle, wordClass: particle }
          - { text: 通ります, reading: とおります, role: predicate, wordClass: predicate }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: pass, role: predicate }
          - { text: ' in front of the station.', role: modifier }
      - japanese: 学校の前を通ります。
        reading: がっこうのまえをとおります。
        meaning: I pass in front of the school.
        tokens:
          - { text: 学校, reading: がっこう, role: modifier, wordClass: modifier }
          - { text: の, reading: の, role: particle, wordClass: particle }
          - { text: 前, reading: まえ, role: modifier, wordClass: modifier }
          - { text: を, reading: を, role: particle, wordClass: particle }
          - { text: 通ります, reading: とおります, role: predicate, wordClass: predicate }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: pass, role: predicate }
          - { text: ' in front of the school.', role: modifier }
      - japanese: 公園を通って帰ります。
        reading: こうえんをとおってかえります。
        meaning: I go home through the park.
        tokens:
          - { text: 公園, reading: こうえん, role: modifier, wordClass: modifier }
          - { text: を, reading: を, role: particle, wordClass: particle }
          - {
              text: 通って帰ります,
              reading: とおってかえります,
              role: predicate,
              wordClass: predicate,
            }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: go home, role: predicate }
          - { text: ' through the park.', role: modifier }
    vocabulary:
      - text: 学校
        reading: がっこう
        role: modifier
        wordClass: modifier
        meaning: school
      - text: 帰ります
        reading: かえります
