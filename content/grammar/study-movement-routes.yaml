entry:
  id: study-movement-routes
  kind: grammar
  title: 'Movement: walking, crossing, flying, boarding and leaving'
  japanese: 橋を渡ります。
  reading: はしをわたります。
  meaning: 'Movement: walking, crossing, flying, boarding and leaving'
  level: N5
  topic: Movement and expressions
  tags:
    - Study guide
  note:
    '歩いて (あるいて) and 徒歩で (とほで) mean on foot: 学校まで歩いて行きます (がっこうまであるいていきます). Use を for a route traversed: 道を歩く
    (みちをあるく), 公園を走る (こうえんをはしる), 空を飛ぶ (そらをとぶ), 橋を渡る (はしをわたる), and 道を通る (みちをとおる). 通る means pass through/along;
    渡る means cross to the other side. Vehicle + に乗る (にのる) means board/get into; vehicle + を降りる (をおりる) means
    get off/out. Place + を出る (をでる) means leave a place; place + に入る (にはいる) means enter. 駅で電車を降ります
    (えきででんしゃをおります): で marks where you get off. 走る and 入る are group 1: 走ります (はしります), 入ります (はいります). 降りる is group
    2: 降ります (おります). In-progress forms include 歩いています (あるいています), 走っています (はしっています), and 飛んでいます (とんでいます).'
  examples:
    - japanese: 橋を渡ります。
      reading: はしをわたります。
      meaning: I cross the bridge.
      tokens:
        - { text: 橋, reading: はし, role: modifier, wordClass: phrase }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 渡ります, reading: わたります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: cross, role: predicate }
        - { text: ' the bridge', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: 電車に乗ります。
      reading: でんしゃにのります。
      meaning: I board the train.
      tokens:
        - { text: 電車, reading: でんしゃ, role: modifier, wordClass: phrase }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - { text: 乗ります, reading: のります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: board, role: predicate }
        - { text: ' the train', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: バスを降ります。
      reading: ばすをおります。
      meaning: I get off the bus.
      tokens:
        - { text: バス, reading: ばす, role: modifier, wordClass: phrase }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 降ります, reading: おります, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: get off, role: predicate }
        - { text: ' the bus', role: modifier }
        - { text: ., role: implicit, implicit: true }
    - japanese: 家を出ます。
      reading: いえをでます。
      meaning: I leave the house.
      tokens:
        - { text: 家, reading: いえ, role: modifier, wordClass: phrase }
        - { text: を, reading: を, role: particle, wordClass: particle }
        - { text: 出ます, reading: でます, role: predicate, wordClass: phrase }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: leave, role: predicate }
        - { text: ' the house', role: modifier }
        - { text: ., role: implicit, implicit: true }
