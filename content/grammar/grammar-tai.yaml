# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-tai
  kind: grammar
  note:
    'Attach たい to the ます stem: 行きます → 行きたいです. The resulting expression inflects like an い-adjective:
    行きたくないです. Use ほしい for a desired thing.'
  tags:
    - Grammar
    - tai
  level: N5
  title: 'Want to do: たい'
  topic: Sentence building
  lesson:
    goal: Say what action you want to do.
    group: Descriptions and preferences
    order: 23
    recap: 'Attach たい to the ます stem, not the full ます form: 飲みます becomes 飲みたいです.'
    examples:
      - tokens:
          - { role: object, text: 水, reading: みず, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 飲みたいです, reading: のみたいです, wordClass: predicate }
        meaning: I want to drink water.
        reading: みずをのみたいです。
        japanese: 水を飲みたいです。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'want to drink ' }
          - { role: object, text: water. }
      - tokens:
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読みたいです, reading: よみたいです, wordClass: predicate }
        meaning: I want to read a book.
        reading: ほんをよみたいです。
        japanese: 本を読みたいです。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'want to read ' }
          - { role: object, text: a book. }
      - tokens:
          - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 食べたいです, reading: たべたいです, wordClass: predicate }
        meaning: I want to eat bread.
        reading: ぱんをたべたいです。
        japanese: パンを食べたいです。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'want to eat ' }
          - { role: object, text: bread. }
    comparison: 'Attach たい to the ます stem, not the full ます form: 飲みます becomes 飲みたいです.'
    vocabulary:
      - text: 水
        meaning: water
        reading: みず
      - text: 飲みたいです
        meaning: want to drink
        reading: のみたいです
      - text: 本
        meaning: book
        reading: ほん
      - text: 読みたいです
        meaning: want to read
        reading: よみたいです
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べたいです
        meaning: want to eat
        reading: たべたいです
      - text: 日本
        meaning: Japan
        reading: にほん
      - text: 行きたいです
        meaning: want to go
        reading: いきたいです
    prerequisites:
      - grammar-masu
      - grammar-hoshii
  meaning: I want to go to Japan.
  reading: にほんにいきたいです。
  examples:
    - tokens:
        - {
            role: modifier,
            text: 日本に,
            reading: にほんに,
            wordClass: destination noun + particle,
          }
        - {
            role: predicate,
            text: 行きたいです,
            reading: いきたいです,
            wordClass: verb stem + desire adjective,
          }
      meaning: I want to go to Japan.
      reading: にほんにいきたいです。
      japanese: 日本に行きたいです。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: want to go, implicit: false }
        - { role: modifier, text: ' to Japan.', implicit: false }
  exercise:
    tiles:
      - 日本
      - に
      - 行きたい
      - です
    prompt: 'Build: “I want to go to Japan.”'
    answers:
      - 日本に行きたいです
      - 日本へ行きたいです
      - にほんにいきたいです
      - にほんへいきたいです
    explanation:
      'Attach たい to the ます stem: 行きます → 行きたいです. The resulting expression inflects like an い-adjective:
      行きたくないです. Use ほしい for a desired thing.'
  japanese: 日本に行きたいです。
  references:
    - rows:
        - - text: 食べます
            reading: たべます
          - text: 食べたいです
            reading: たべたいです
          - text: 食べたい
            reading: たべたい
          - text: 食べたくないです
            reading: たべたくないです
        - - text: 飲みます
            reading: のみます
          - text: 飲みたいです
            reading: のみたいです
          - text: 飲みたい
            reading: のみたい
          - text: 飲みたくないです
            reading: のみたくないです
        - - text: 行きます
            reading: いきます
          - text: 行きたいです
            reading: いきたいです
          - text: 行きたい
            reading: いきたい
          - text: 行きたくないです
            reading: いきたくないです
        - - text: 勉強します
            reading: べんきょうします
          - text: 勉強したいです
            reading: べんきょうしたいです
          - text: 勉強したい
            reading: べんきょうしたい
          - text: 勉強したくないです
            reading: べんきょうしたくないです
      columns:
        - Verb
        - Polite
        - Casual
        - Negative (polite)
      heading: 'ます stem + たい: polite and casual'
