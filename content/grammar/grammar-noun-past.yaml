# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-noun-past
  kind: grammar
  note:
    'Noun + でした is the polite past of noun + です. Negative past: じゃありませんでした / ではありませんでした. This noun pattern
    is different from an い-adjective past ending in かった.'
  tags:
    - Grammar
    - noun-past
  level: N5
  title: 'Noun past: でした'
  topic: Sentence building
  lesson:
    goal: Describe what something was.
    group: Negatives and past
    order: 15
    recap: Use noun + でした for the past. ます is a verb ending, not the past of です.
    examples:
      - tokens:
          - { role: topic, text: 昨日, reading: きのう, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 休みでした, reading: やすみでした, wordClass: predicate }
        meaning: Yesterday was a day off.
        reading: きのうはやすみでした。
        japanese: 昨日は休みでした。
        translationTokens:
          - { role: topic, text: Yesterday }
          - { role: predicate, text: ' was a day off.' }
      - tokens:
          - { role: topic, text: 田中さん, reading: たなかさん, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 学生でした, reading: がくせいでした, wordClass: predicate }
        meaning: Tanaka was a student.
        reading: たなかさんはがくせいでした。
        japanese: 田中さんは学生でした。
        translationTokens:
          - { role: topic, text: Tanaka }
          - { role: predicate, text: ' was a student.' }
      - tokens:
          - { role: topic, text: ここ, reading: ここ, wordClass: noun phrase }
          - { role: particle, text: は, reading: は, wordClass: particle }
          - { role: predicate, text: 学校でした, reading: がっこうでした, wordClass: predicate }
        meaning: This place was a school.
        reading: ここはがっこうでした。
        japanese: ここは学校でした。
        translationTokens:
          - { role: topic, text: This place }
          - { role: predicate, text: ' was a school.' }
    comparison: Use noun + でした for the past. ます is a verb ending, not the past of です.
    vocabulary:
      - text: 昨日
        meaning: yesterday
        reading: きのう
      - text: 休み
        meaning: day off / rest
        reading: やすみ
      - text: 田中さん
        meaning: Tanaka (a person's name)
        reading: たなかさん
      - text: 学生
        meaning: student
        reading: がくせい
      - text: 学校
        meaning: school
        reading: がっこう
      - text: 雨
        meaning: rain
        reading: あめ
    prerequisites:
      - grammar-desu
      - grammar-noun-negative
  meaning: Yesterday was a day off.
  reading: きのうはやすみでした。
  examples:
    - tokens:
        - { role: topic, text: 昨日, reading: きのう, wordClass: time noun }
        - { role: particle, text: は, reading: は, wordClass: particle }
        - {
            role: predicate,
            text: 休みでした,
            reading: やすみでした,
            wordClass: noun + past copula,
          }
      meaning: Yesterday was a day off.
      reading: きのうはやすみでした。
      japanese: 昨日は休みでした。
      translationTokens:
        - { role: topic, text: Yesterday, implicit: false }
        - { role: predicate, text: ' was a day off.', implicit: false }
  exercise:
    tiles:
      - 昨日
      - は
      - 休み
      - でした
    prompt: 'Build: “Yesterday was a day off.”'
    answers:
      - 昨日は休みでした
      - きのうはやすみでした
    explanation:
      'Noun + でした is the polite past of noun + です. Negative past: じゃありませんでした / ではありませんでした. This noun
      pattern is different from an い-adjective past ending in かった.'
  japanese: 昨日は休みでした。
