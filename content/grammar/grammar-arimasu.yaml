# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-arimasu
  kind: grammar
  note:
    'Use あります for things and plants. が marks what exists. The existence pattern can also express possession:
    時間があります means “I have time”. This is an existence verb, not the negative copula in じゃありません.'
  tags:
    - Grammar
    - arimasu
  level: N5
  title: 'Things exist: あります'
  topic: Sentence building
  lesson:
    goal: Say that a thing exists.
    group: Existence and location
    order: 11
    recap: Use あります for things and plants; use います for people and animals.
    examples:
      - tokens:
          - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: あります, reading: あります, wordClass: predicate }
        meaning: There is a book.
        reading: ほんがあります。
        japanese: 本があります。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a book. }
      - tokens:
          - { role: subject, text: 机, reading: つくえ, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: あります, reading: あります, wordClass: predicate }
        meaning: There is a desk.
        reading: つくえがあります。
        japanese: 机があります。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a desk. }
      - tokens:
          - { role: subject, text: 時計, reading: とけい, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: あります, reading: あります, wordClass: predicate }
        meaning: There is a clock.
        reading: とけいがあります。
        japanese: 時計があります。
        translationTokens:
          - { role: predicate, text: 'There is ' }
          - { role: subject, text: a clock. }
    comparison: Use あります for things and plants; use います for people and animals.
    vocabulary:
      - text: 本
        meaning: book
        reading: ほん
      - text: 机
        meaning: desk
        reading: つくえ
      - text: 時計
        meaning: clock / watch
        reading: とけい
      - text: 車
        meaning: car
        reading: くるま
    prerequisites:
      - grammar-desu
  meaning: There is a desk.
  reading: つくえがあります。
  examples:
    - tokens:
        - { role: subject, text: 机, reading: つくえ, wordClass: noun }
        - { role: particle, text: が, reading: が, wordClass: subject particle }
        - { role: predicate, text: あります, reading: あります, wordClass: existence verb }
      meaning: There is a desk.
      reading: つくえがあります。
      japanese: 机があります。
      translationTokens:
        - { role: predicate, text: 'There is ', implicit: false }
        - { role: subject, text: a desk., implicit: false }
  exercise:
    tiles:
      - 机
      - が
      - あります
    prompt: 'Build: “There is a desk.”'
    answers:
      - 机があります
      - つくえがあります
    explanation:
      'Use あります for things and plants. が marks what exists. The existence pattern can also express
      possession: 時間があります means “I have time”. This is an existence verb, not the negative copula in じゃありません.'
  japanese: 机があります。
