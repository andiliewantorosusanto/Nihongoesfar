exercises:
  - id: meaning
    type: meaning-choice
    sentence: there-is-a-book
    choices:
      - text: There is a book.
        reading: ''
      - text: There is a cat.
        reading: ''
    answers:
      - There is a book.
  - id: pattern
    type: pattern-choice
    sentence: there-is-a-book
    choices:
      - sentence: there-is-a-book
      - text: 本がいます。
        tiles:
          - { text: 本, reading: ほん }
          - { text: が, reading: が }
          - { text: います, reading: います }
        tokens:
          - { role: subject, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: が, reading: が, wordClass: particle }
          - { role: predicate, text: います, reading: います, wordClass: predicate }
        meaning: There is a cat.
        reading: ほんがいます。
    prompt: 'Choose the correct Japanese: There is a book.'
    answers:
      - 本があります
      - ほんがあります
  - id: gap
    type: gap
    sentence: there-is-a-desk
    answers:
      - あります
      - あります
    context:
      text: 机が___。
      tokens:
        - { role: subject, text: 机, reading: つくえ, wordClass: noun phrase }
        - { role: particle, text: が, reading: が, wordClass: particle }
        - { role: predicate, text: ___, reading: ___, wordClass: predicate }
      reading: つくえが___。
  - id: tiles
    type: tiles
    sentence: there-is-a-desk
    prompt: 'Build this sentence: There is a desk. (polite)'
    answers:
      - 机があります
      - つくえがあります
    tiles:
      - { role: subject, text: 机, reading: つくえ, wordClass: noun phrase }
      - { role: particle, text: が, reading: が, wordClass: particle }
      - { role: predicate, text: あります, reading: あります, wordClass: predicate }
  - id: typing
    type: typing
    sentence: there-is-a-clock
    answers:
      - 時計があります
      - とけいがあります
  - id: alternate
    type: typing
    sentence: there-is-a-car
    alternate: true
    prompt: 'One more example: There is a car. (polite)'
    answers:
      - 車があります
      - くるまがあります
