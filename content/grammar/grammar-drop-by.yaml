# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-drop-by
  kind: grammar
  title: 'Stopping by: 〜に寄る'
  japanese: 店に寄ります。
  reading: みせによります。
  meaning: I stop by the shop.
  level: N5
  topic: Passing places
  tags:
    - Grammar
    - drop-by
  note:
    Use place + に + よる for a short stop or visit. よって connects it to the next action. とおる means passing
    along or by; よる means stopping there.
  examples:
    - japanese: 店に寄ります。
      reading: みせによります。
      meaning: I stop by the shop.
      tokens:
        - { text: 店, reading: みせ, role: modifier, wordClass: modifier }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - { text: 寄ります, reading: よります, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: stop by, role: predicate }
        - { text: ' the shop.', role: modifier }
    - japanese: 銀行に寄って帰ります。
      reading: ぎんこうによってかえります。
      meaning: I stop by the bank and then go home.
      tokens:
        - { text: 銀行, reading: ぎんこう, role: modifier, wordClass: modifier }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - { text: 寄って帰ります, reading: よってかえります, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: stop by, role: predicate }
        - { text: ' the bank', role: modifier }
        - { text: ' and then go home.', role: predicate }
    - japanese: 友達の家に寄ります。
      reading: ともだちのいえによります。
      meaning: I drop by my friend's house.
      tokens:
        - { text: 友達, reading: ともだち, role: modifier, wordClass: modifier }
        - { text: の, reading: の, role: particle, wordClass: particle }
        - { text: 家, reading: いえ, role: modifier, wordClass: modifier }
        - { text: に, reading: に, role: particle, wordClass: particle }
        - { text: 寄ります, reading: よります, role: predicate, wordClass: predicate }
      translationTokens:
        - { text: 'I ', role: implicit, implicit: true }
        - { text: drop by, role: predicate }
        - { text: " my friend's house.", role: modifier }
  lesson:
    order: 30
    group: Passing places
    goal: Say you stop by a place on the way.
    prerequisites:
      - grammar-destination
      - grammar-te-sequence
    recap:
      Use place + に + よる for a short stop or visit. よって connects it to the next action. とおる means passing
      along or by; よる means stopping there.
    comparison:
      Use place + に + よる for a short stop or visit. よって connects it to the next action. とおる means
      passing along or by; よる means stopping there.
    examples:
      - japanese: 店に寄ります。
        reading: みせによります。
        meaning: I stop by the shop.
        tokens:
          - { text: 店, reading: みせ, role: modifier, wordClass: modifier }
          - { text: に, reading: に, role: particle, wordClass: particle }
          - { text: 寄ります, reading: よります, role: predicate, wordClass: predicate }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: stop by, role: predicate }
          - { text: ' the shop.', role: modifier }
      - japanese: 銀行に寄って帰ります。
        reading: ぎんこうによってかえります。
        meaning: I stop by the bank and then go home.
        tokens:
          - { text: 銀行, reading: ぎんこう, role: modifier, wordClass: modifier }
          - { text: に, reading: に, role: particle, wordClass: particle }
          - {
              text: 寄って帰ります,
              reading: よってかえります,
              role: predicate,
              wordClass: predicate,
            }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: stop by, role: predicate }
          - { text: ' the bank', role: modifier }
          - { text: ' and then go home.', role: predicate }
      - japanese: 友達の家に寄ります。
        reading: ともだちのいえによります。
        meaning: I drop by my friend's house.
        tokens:
          - { text: 友達, reading: ともだち, role: modifier, wordClass: modifier }
          - { text: の, reading: の, role: particle, wordClass: particle }
          - { text: 家, reading: いえ, role: modifier, wordClass: modifier }
          - { text: に, reading: に, role: particle, wordClass: particle }
          - { text: 寄ります, reading: よります, role: predicate, wordClass: predicate }
        translationTokens:
          - { text: 'I ', role: implicit, implicit: true }
          - { text: drop by, role: predicate }
          - { text: " my friend's house.", role: modifier }
    vocabulary:
      - text: 帰ります
        reading: かえります
        role: predicate
        wordClass: predicate
        meaning: return
      - text: 家
        reading: いえ
        role: modifier
        wordClass: modifier
        meaning: home / house
