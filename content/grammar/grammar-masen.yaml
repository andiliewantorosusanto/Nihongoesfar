# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-masen
  kind: grammar
  note:
    'Replace ます with ません for a polite non-past negative: 食べます → 食べません. Do not add じゃありません to the dictionary
    form of a verb. 食べません may mean a habit or a future choice in context.'
  tags:
    - Grammar
    - masen
  level: N5
  title: 'Polite verb negative: ません'
  topic: Sentence building
  lesson:
    goal: Say that you do not do an action.
    group: Negatives and past
    order: 16
    recap: Replace verb ます with ません. Do not attach noun-negative じゃありません to a verb stem.
    examples:
      - tokens:
          - { role: object, text: 水, reading: みず, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 飲みません, reading: のみません, wordClass: predicate }
        meaning: I do not drink water.
        reading: みずをのみません。
        japanese: 水を飲みません。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'do not drink ' }
          - { role: object, text: water. }
      - tokens:
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読みません, reading: よみません, wordClass: predicate }
        meaning: I do not read books.
        reading: ほんをよみません。
        japanese: 本を読みません。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'do not read ' }
          - { role: object, text: books. }
      - tokens:
          - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 食べません, reading: たべません, wordClass: predicate }
        meaning: I do not eat bread.
        reading: ぱんをたべません。
        japanese: パンを食べません。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'do not eat ' }
          - { role: object, text: bread. }
    comparison: Replace verb ます with ません. Do not attach noun-negative じゃありません to a verb stem.
    vocabulary:
      - text: 水
        meaning: water
        reading: みず
      - text: 飲みません
        meaning: do not drink
        reading: のみません
      - text: 本
        meaning: book
        reading: ほん
      - text: 読みません
        meaning: do not read
        reading: よみません
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べません
        meaning: do not eat
        reading: たべません
      - text: 今日
        meaning: today
        reading: きょう
      - text: 働きません
        meaning: do not work
        reading: はたらきません
    prerequisites:
      - grammar-masu
      - grammar-object
  meaning: I do not eat meat.
  reading: にくをたべません。
  examples:
    - tokens:
        - { role: object, text: 肉, reading: にく, wordClass: noun }
        - { role: particle, text: を, reading: を, wordClass: object particle }
        - { role: predicate, text: 食べません, reading: たべません, wordClass: negative verb }
      meaning: I do not eat meat.
      reading: にくをたべません。
      japanese: 肉を食べません。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: do not eat, implicit: false }
        - { role: object, text: ' meat.', implicit: false }
  exercise:
    tiles:
      - 肉
      - を
      - 食べません
    prompt: 'Build: “I do not eat meat.”'
    answers:
      - 肉を食べません
      - にくをたべません
    explanation:
      'Replace ます with ません for a polite non-past negative: 食べます → 食べません. Do not add じゃありません to the
      dictionary form of a verb. 食べません may mean a habit or a future choice in context.'
  japanese: 肉を食べません。
