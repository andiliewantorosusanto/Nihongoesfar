# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-adjective-kute
  kind: grammar
  title: 'Connecting い-adjectives: 〜くて'
  japanese: この本は面白くて安いです。
  reading: このほんはおもしろくてやすいです。
  meaning: This book is interesting and inexpensive.
  level: N5
  topic: Connecting descriptions and actions
  tags:
    - Grammar
    - adjective-kute
  note:
    'Replace the final い with くて to connect descriptions: たかい → たかくて. いい becomes よくて. The final description
    carries tense and politeness.'
  examples:
    - japanese: この本は面白くて安いです。
      reading: このほんはおもしろくてやすいです。
      meaning: This book is interesting and inexpensive.
      tokens:
        - { text: この, reading: この, role: modifier, wordClass: modifier }
        - { text: 本, reading: ほん, role: topic, wordClass: noun phrase }
        - { text: は, reading: は, role: particle, wordClass: particle }
        - {
            text: 面白くて安いです,
            reading: おもしろくてやすいです,
            role: predicate,
            wordClass: predicate,
          }
      translationTokens:
        - { text: 'This ', role: modifier }
        - { text: book, role: topic }
        - { text: ' is interesting and inexpensive.', role: predicate }
    - japanese: この車は大きくて新しいです。
      reading: このくるまはおおきくてあたらしいです。
      meaning: This car is big and new.
      tokens:
        - { text: この, reading: この, role: modifier, wordClass: modifier }
        - { text: 車, reading: くるま, role: topic, wordClass: noun phrase }
        - { text: は, reading: は, role: particle, wordClass: particle }
        - {
            text: 大きくて新しいです,
            reading: おおきくてあたらしいです,
            role: predicate,
            wordClass: predicate,
          }
      translationTokens:
        - { text: 'This ', role: modifier }
        - { text: car, role: topic }
        - { text: ' is big and new.', role: predicate }
    - japanese: この部屋は明るくて広いです。
      reading: このへやはあかるくてひろいです。
      meaning: This room is bright and spacious.
      tokens:
        - { text: この, reading: この, role: modifier, wordClass: modifier }
        - { text: 部屋, reading: へや, role: topic, wordClass: noun phrase }
        - { text: は, reading: は, role: particle, wordClass: particle }
        - {
            text: 明るくて広いです,
            reading: あかるくてひろいです,
            role: predicate,
            wordClass: predicate,
          }
      translationTokens:
        - { text: 'This ', role: modifier }
        - { text: room, role: topic }
        - { text: ' is bright and spacious.', role: predicate }
