# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-object
  kind: grammar
  note:
    を marks the direct object of many action verbs and is pronounced o. The person doing the action can be
    omitted when clear. 水を飲みます is a verb sentence; 水です is a noun sentence.
  tags:
    - Grammar
    - object
  level: N5
  title: 'Direct object: を'
  topic: Sentence building
  lesson:
    goal: Say what you eat, drink, or read.
    group: Polite verbs and particles
    order: 7
    recap:
      を marks the object of an action. は marks a topic and does not replace the object marker in this basic
      pattern.
    examples:
      - tokens:
          - { role: object, text: 水, reading: みず, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 飲みます, reading: のみます, wordClass: predicate }
        meaning: I drink water.
        reading: みずをのみます。
        japanese: 水を飲みます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'drink ' }
          - { role: object, text: water. }
      - tokens:
          - { role: object, text: 本, reading: ほん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 読みます, reading: よみます, wordClass: predicate }
        meaning: I read a book.
        reading: ほんをよみます。
        japanese: 本を読みます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'read ' }
          - { role: object, text: a book. }
      - tokens:
          - { role: object, text: パン, reading: ぱん, wordClass: noun phrase }
          - { role: particle, text: を, reading: を, wordClass: particle }
          - { role: predicate, text: 食べます, reading: たべます, wordClass: predicate }
        meaning: I eat bread.
        reading: ぱんをたべます。
        japanese: パンを食べます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: 'eat ' }
          - { role: object, text: bread. }
    comparison:
      を marks the object of an action. は marks a topic and does not replace the object marker in this
      basic pattern.
    vocabulary:
      - text: 水
        meaning: water
        reading: みず
      - text: 飲みます
        meaning: drink
        reading: のみます
      - text: 本
        meaning: book
        reading: ほん
      - text: 読みます
        meaning: read
        reading: よみます
      - text: パン
        meaning: bread
        reading: ぱん
      - text: 食べます
        meaning: eat
        reading: たべます
      - text: お茶
        meaning: tea
        reading: おちゃ
    prerequisites:
      - grammar-masu
  meaning: I drink water.
  reading: みずをのみます。
  examples:
    - tokens:
        - { role: object, text: 水, reading: みず, wordClass: noun }
        - { role: particle, text: を, reading: を, wordClass: object particle }
        - { role: predicate, text: 飲みます, reading: のみます, wordClass: verb }
      meaning: I drink water.
      reading: みずをのみます。
      japanese: 水を飲みます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: drink, implicit: false }
        - { role: object, text: ' water.', implicit: false }
  exercise:
    tiles:
      - 水
      - を
      - 飲みます
    prompt: 'Build: “I drink water.” Leave out 私.'
    answers:
      - 水を飲みます
      - みずをのみます
    explanation:
      を marks the direct object of many action verbs and is pronounced o. The person doing the action
      can be omitted when clear. 水を飲みます is a verb sentence; 水です is a noun sentence.
  japanese: 水を飲みます。
