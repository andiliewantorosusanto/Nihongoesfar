# Grammar source. Run npm run content:build after editing.
entry:
  id: study-particle-kara
  kind: grammar
  note:
    'から marks a starting point: a place or a time. まで marks an endpoint and is optional. Use どこから to ask
    “from where?” and 何時から (なんじから) to ask “from what time?”. You do not add に after から in these patterns. This
    lesson covers “from”; clause + から meaning “because” is a different pattern.'
  tags:
    - Study guide
  level: N5
  title: から — from a place or starting time
  topic: Polite verbs and particles
  meaning: から — from a place or starting time
  reading: いえからがっこうまであるきます。
  examples:
    - tokens:
        - { role: modifier, text: 家, reading: いえ, wordClass: noun phrase }
        - { role: particle, text: から, reading: から, wordClass: particle }
        - { role: modifier, text: 学校, reading: がっこう, wordClass: noun phrase }
        - { role: particle, text: まで, reading: まで, wordClass: particle }
        - { role: predicate, text: 歩きます, reading: あるきます, wordClass: predicate }
      meaning: I walk from home to school.
      reading: いえからがっこうまであるきます。
      japanese: 家から学校まで歩きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: walk }
        - { role: modifier, text: ' from home' }
        - { role: modifier, text: ' to school.' }
    - tokens:
        - { role: modifier, text: 九時, reading: くじ, wordClass: noun phrase }
        - { role: particle, text: から, reading: から, wordClass: particle }
        - { role: predicate, text: 勉強します, reading: べんきょうします, wordClass: predicate }
      meaning: I study from nine.
      reading: くじからべんきょうします。
      japanese: 九時から勉強します。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: study }
        - { role: modifier, text: ' from nine.' }
    - tokens:
        - { role: modifier, text: インドネシア, reading: いんどねしあ, wordClass: noun phrase }
        - { role: particle, text: から, reading: から, wordClass: particle }
        - { role: predicate, text: 来ました, reading: きました, wordClass: predicate }
      meaning: I came from Indonesia.
      reading: いんどねしあからきました。
      japanese: インドネシアから来ました。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: came }
        - { role: modifier, text: ' from Indonesia.' }
    - tokens:
        - { role: modifier, text: 八時, reading: はちじ, wordClass: noun phrase }
        - { role: particle, text: から, reading: から, wordClass: particle }
        - { role: modifier, text: 五時, reading: ごじ, wordClass: noun phrase }
        - { role: particle, text: まで, reading: まで, wordClass: particle }
        - { role: predicate, text: 働きます, reading: はたらきます, wordClass: predicate }
      meaning: I work from eight until five.
      reading: はちじからごじまではたらきます。
      japanese: 八時から五時まで働きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: work }
        - { role: modifier, text: ' from eight' }
        - { role: modifier, text: ' until five.' }
  japanese: 家から学校まで歩きます。
  references:
    - rows:
        - - text: Origin
            reading: ''
          - text: どこから来ましたか
            reading: どこからきましたか
          - text: インドネシアから来ました
            reading: いんどねしあからきました
          - text: Where did you come from? — I came from Indonesia.
            reading: ''
        - - text: Starting time
            reading: ''
          - text: 何時から勉強しますか
            reading: なんじからべんきょうしますか
          - text: 九時から勉強します
            reading: くじからべんきょうします
          - text: From what time will you study? — From nine.
            reading: ''
        - - text: Time range
            reading: ''
          - text: 何時から何時まで働きますか
            reading: なんじからなんじまではたらきますか
          - text: 八時から五時まで働きます
            reading: はちじからごじまではたらきます
          - text: From what time until what time do you work? — From eight until five.
            reading: ''
        - - text: Route
            reading: ''
          - text: どこからどこまで歩きますか
            reading: どこからどこまであるきますか
          - text: 家から学校まで歩きます
            reading: いえからがっこうまであるきます
          - text: From where to where do you walk? — From home to school.
            reading: ''
      columns:
        - Use
        - Question
        - Example answer
        - Meaning
      heading: Starting points and endpoints
