# Grammar source. Run npm run content:build after editing.
entry:
  id: grammar-destination
  kind: grammar
  note: >-
    に marks a destination with 行きます / 来ます / 帰ります. へ emphasizes direction and is pronounced e. 学校に行きます and
    学校へ行きます are both natural here.

    行きます (いきます) means go; 来ます (きます) means come toward the speaker or the viewpoint location; 帰ります (かえります)
    means return home or to a familiar base. に and へ can both mark the destination in these examples. へ is
    pronounced “e”. Use で for transport, as in バスで学校に行きます (ばすでがっこうにいきます).
  tags:
    - Grammar
    - destination
  level: N5
  title: 'Destinations: に・へ'
  topic: Sentence building
  lesson:
    goal: Say where you go.
    group: Polite verbs and particles
    order: 9
    recap:
      に or へ can mark a destination. で marks where an action takes place, not the destination in these
      sentences.
    examples:
      - tokens:
          - { role: modifier, text: 学校, reading: がっこう, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: predicate, text: 行きます, reading: いきます, wordClass: predicate }
        meaning: I go to school.
        reading: がっこうにいきます。
        japanese: 学校に行きます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: go }
          - { role: modifier, text: ' to school.' }
      - tokens:
          - { role: modifier, text: 図書館, reading: としょかん, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: predicate, text: 行きます, reading: いきます, wordClass: predicate }
        meaning: I go to the library.
        reading: としょかんにいきます。
        japanese: 図書館に行きます。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: go }
          - { role: modifier, text: ' to the library.' }
      - tokens:
          - { role: modifier, text: 家, reading: いえ, wordClass: modifier }
          - { role: particle, text: に, reading: に, wordClass: particle }
          - { role: predicate, text: 帰ります, reading: かえります, wordClass: predicate }
        meaning: I return home.
        reading: いえにかえります。
        japanese: 家に帰ります。
        translationTokens:
          - { role: implicit, text: 'I ', implicit: true }
          - { role: predicate, text: return }
          - { role: modifier, text: ' home.' }
    comparison:
      に or へ can mark a destination. で marks where an action takes place, not the destination in these
      sentences.
    vocabulary:
      - text: 学校
        meaning: school
        reading: がっこう
      - text: 行きます
        meaning: go
        reading: いきます
      - text: 図書館
        meaning: library
        reading: としょかん
      - text: 家
        meaning: home / house
        reading: いえ
      - text: 帰ります
        meaning: return
        reading: かえります
      - text: 日本
        meaning: Japan
        reading: にほん
    prerequisites:
      - grammar-masu
  meaning: I go to school.
  reading: がっこうにいきます。
  examples:
    - tokens:
        - {
            role: modifier,
            text: 学校に,
            reading: がっこうに,
            wordClass: destination noun + particle,
          }
        - { role: predicate, text: 行きます, reading: いきます, wordClass: verb }
      meaning: I go to school.
      reading: がっこうにいきます。
      japanese: 学校に行きます。
      translationTokens:
        - { role: implicit, text: 'I ', implicit: true }
        - { role: predicate, text: go, implicit: false }
        - { role: modifier, text: ' to school.', implicit: false }
  exercise:
    tiles:
      - 学校
      - に
      - 行きます
    prompt: 'Build: “I go to school.”'
    answers:
      - 学校に行きます
      - 学校へ行きます
      - がっこうにいきます
      - がっこうへいきます
    explanation:
      に marks a destination with 行きます / 来ます / 帰ります. へ emphasizes direction and is pronounced e. 学校に行きます
      and 学校へ行きます are both natural here.
  japanese: 学校に行きます。
  references:
    - rows:
        - - text: 行きます / 行く
            reading: いきます / いく
          - text: 学校に行きます
            reading: がっこうにいきます
          - text: 学校へ行きます
            reading: がっこうへいきます
          - text: go to school
            reading: ''
        - - text: 来ます / 来る
            reading: きます / くる
          - text: ここに来ます
            reading: ここにきます
          - text: ここへ来ます
            reading: ここへきます
          - text: come here
            reading: ''
        - - text: 帰ります / 帰る
            reading: かえります / かえる
          - text: 家に帰ります
            reading: いえにかえります
          - text: 家へ帰ります
            reading: いえへかえります
          - text: return home
            reading: ''
      columns:
        - Verb
        - With に
        - With へ
        - Meaning
      heading: Destination + に / へ + movement verb
