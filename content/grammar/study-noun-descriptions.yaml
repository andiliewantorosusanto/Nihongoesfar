# Grammar source. Run npm run content:build after editing.
entry:
  id: study-noun-descriptions
  kind: grammar
  note:
    'Keep い directly before a noun: おいしい料理 (おいしいりょうり). Add な between a な-adjective and a noun: 静かな町
    (しずかなまち). Link a describing noun to another noun with の: 日本の料理 (にほんのりょうり). Do not use です or だ between the
    description and its noun. Compare 日本の料理はおいしいです (にほんのりょうりはおいしいです, Japanese food is delicious) with
    おいしい日本の料理 (おいしいにほんのりょうり, delicious Japanese food).'
  tags:
    - Study guide
    - Adjective guide
  level: N5
  title: 'Describe nouns: い / な / の'
  topic: Adjectives and noun descriptions
  meaning: 'Describe nouns: い / な / の'
  reading: おいしいりょうりです。
  examples:
    - tokens:
        - { role: modifier, text: おいしい, reading: おいしい, wordClass: noun phrase }
        - { role: predicate, text: 料理, reading: りょうり, wordClass: predicate }
        - { role: predicate, text: です, reading: です, wordClass: predicate }
      meaning: It is a delicious dish.
      reading: おいしいりょうりです。
      japanese: おいしい料理です。
      translationTokens:
        - { role: implicit, text: 'It ', implicit: true }
        - { role: predicate, text: 'is a ' }
        - { role: modifier, text: 'delicious ' }
        - { role: predicate, text: dish. }
    - tokens:
        - { role: modifier, text: 静か, reading: しずか, wordClass: noun phrase }
        - { role: particle, text: な, reading: な, wordClass: particle }
        - { role: predicate, text: 町, reading: まち, wordClass: predicate }
        - { role: predicate, text: です, reading: です, wordClass: predicate }
      meaning: It is a quiet town.
      reading: しずかなまちです。
      japanese: 静かな町です。
      translationTokens:
        - { role: implicit, text: 'It ', implicit: true }
        - { role: predicate, text: 'is a ' }
        - { role: modifier, text: 'quiet ' }
        - { role: predicate, text: town. }
    - tokens:
        - { role: modifier, text: 日本, reading: にほん, wordClass: noun phrase }
        - { role: particle, text: の, reading: の, wordClass: particle }
        - { role: predicate, text: 料理, reading: りょうり, wordClass: predicate }
        - { role: predicate, text: です, reading: です, wordClass: predicate }
      meaning: It is Japanese food.
      reading: にほんのりょうりです。
      japanese: 日本の料理です。
      translationTokens:
        - { role: implicit, text: 'It ', implicit: true }
        - { role: predicate, text: 'is ' }
        - { role: modifier, text: 'Japanese ' }
        - { role: predicate, text: food. }
    - tokens:
        - { role: modifier, text: きれい, reading: きれい, wordClass: noun phrase }
        - { role: particle, text: な, reading: な, wordClass: particle }
        - { role: predicate, text: 部屋, reading: へや, wordClass: predicate }
        - { role: predicate, text: です, reading: です, wordClass: predicate }
      meaning: It is a clean room.
      reading: きれいなへやです。
      japanese: きれいな部屋です。
      translationTokens:
        - { role: implicit, text: 'It ', implicit: true }
        - { role: predicate, text: 'is a ' }
        - { role: modifier, text: 'clean ' }
        - { role: predicate, text: room. }
  japanese: おいしい料理です。
  references:
    - rows:
        - - text: い-adjective
            reading: ''
          - text: い-adjective + noun
            reading: ''
          - text: おいしい料理
            reading: おいしいりょうり
          - text: a delicious dish
            reading: ''
        - - text: な-adjective
            reading: ''
          - text: な-adjective + な + noun
            reading: ''
          - text: 静かな町
            reading: しずかなまち
          - text: a quiet town
            reading: ''
        - - text: Noun
            reading: ''
          - text: noun + の + noun
            reading: ''
          - text: 日本の料理
            reading: にほんのりょうり
          - text: Japanese food
            reading: ''
        - - text: Exception ending in い
            reading: ''
          - text: きれい + な + noun
            reading: きれい + な + noun
          - text: きれいな部屋
            reading: きれいなへや
          - text: a clean room
            reading: ''
      columns:
        - Type
        - Pattern
        - Example
        - Meaning
      heading: What goes before the noun?
