services:
  database:
    image: postgres:17-bookworm
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-notebook}
      POSTGRES_DB: notebook
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notebook -d notebook"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  notebook:
    build: .
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3001}
      DATABASE_URL: postgresql://notebook:${POSTGRES_PASSWORD:-notebook}@database:5432/notebook
      OWNER_KEY: ${OWNER_KEY:-}
      SQLITE_IMPORT_PATH: /legacy-data/notebook.sqlite
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - notebook-data:/legacy-data
    restart: unless-stopped
volumes:
  postgres-data:
  notebook-data:
